<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Premium Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f1f5f9;
            color: #111827;
        }
        .admin-wrapper { display: flex; min-height: 100vh; }
        
        .sidebar {
            width: 260px;
            background: white;
            border-right: 1px solid #e2e8f0;
            padding: 24px 16px;
            height: 100vh;
            position: sticky;
            top: 0;
            overflow-y: auto;
        }
        .sidebar .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 8px 24px 8px;
            border-bottom: 1px solid #f1f5f9;
            margin-bottom: 24px;
        }
        .sidebar .brand .icon {
            width: 36px;
            height: 36px;
            background: #4f46e5;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
        }
        .sidebar .brand h1 { font-size: 18px; font-weight: 700; color: #111827; }
        .sidebar .nav { display: flex; flex-direction: column; gap: 4px; }
        .sidebar .nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .sidebar .nav a:hover { background: #f1f5f9; color: #111827; }
        .sidebar .nav a.active { background: #eef2ff; color: #4f46e5; font-weight: 600; }
        .sidebar .nav a .emoji { font-size: 18px; width: 24px; text-align: center; }
        .sidebar .logout-btn {
            margin-top: 24px;
            padding: 10px 12px;
            width: 100%;
            background: #fef2f2;
            color: #dc2626;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .sidebar .logout-btn:hover { background: #fee2e2; }

        .main-content { flex: 1; padding: 32px; max-width: calc(100% - 260px); }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }
        .header h1 { font-size: 28px; font-weight: 700; color: #111827; }
        .header .subtitle { color: #64748b; font-size: 14px; margin-top: 4px; }
        .header .actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .search-input {
            padding: 10px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            background: white;
            min-width: 200px;
        }
        .search-input:focus { outline: none; border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
        .filter-select {
            padding: 10px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            background: white;
            cursor: pointer;
        }

        .premium-table-container {
            background: white;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .premium-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .premium-table th {
            background: #f8fafc;
            text-align: left;
            padding: 14px 16px;
            font-weight: 600;
            color: #475569;
            border-bottom: 1px solid #e2e8f0;
        }
        .premium-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: middle;
        }
        .premium-table tr:last-child td { border-bottom: none; }
        .premium-table tr:hover { background: #fafbfc; }

        .user-info { display: flex; align-items: center; gap: 12px; }
        .user-info img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background: #f1f5f9;
        }
        .user-info .name { font-weight: 600; color: #111827; }
        .user-info .username { color: #64748b; font-size: 13px; }

        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        .badge-premium { background: #fef3c7; color: #d97706; }
        .badge-owner { background: #dbeafe; color: #2563eb; }
        .badge-user { background: #f1f5f9; color: #475569; }

        .actions-cell { display: flex; gap: 6px; flex-wrap: wrap; }
        .actions-cell button {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-premium { background: #fef3c7; color: #d97706; }
        .btn-premium:hover { background: #fde68a; }
        .btn-premium.active { background: #d97706; color: white; }
        .btn-owner { background: #dbeafe; color: #2563eb; }
        .btn-owner:hover { background: #bfdbfe; }
        .btn-owner.active { background: #2563eb; color: white; }
        .btn-user { background: #f1f5f9; color: #475569; }
        .btn-user:hover { background: #e2e8f0; }

        .loading-state { text-align: center; padding: 60px 24px; color: #64748b; }
        .loading-state .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid #e2e8f0;
            border-top-color: #4f46e5;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .admin-wrapper { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: relative; padding: 16px; }
            .main-content { max-width: 100%; padding: 16px; }
            .header { flex-direction: column; align-items: stretch; }
            .header .actions { flex-direction: column; }
            .search-input { width: 100%; }
            .filter-select { width: 100%; }
            .actions-cell { flex-direction: column; }
            .actions-cell button { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="admin-wrapper">
        <aside class="sidebar">
            <div class="brand">
                <div class="icon">🛡️</div>
                <h1>Admin Panel</h1>
            </div>
            <nav class="nav">
                <a href="/admin.auth/dashboard/"><span class="emoji">📊</span> Dashboard</a>
                <a href="/admin.auth/users/"><span class="emoji">👥</span> Users</a>
                <a href="/admin.auth/prompts/"><span class="emoji">📝</span> Prompts</a>
                <a href="/admin.auth/add/"><span class="emoji">➕</span> Add Prompt</a>
                <div class="divider"></div>
                <a href="/admin.auth/reports.u/"><span class="emoji">🚨</span> User Reports</a>
                <a href="/admin.auth/reports.p/"><span class="emoji">⚠️</span> Prompt Reports</a>
                <a href="/admin.auth/premium/" class="active"><span class="emoji">⭐</span> Premium</a>
                <button class="logout-btn" id="logoutBtn"><span class="emoji">🚪</span> Sign Out</button>
            </nav>
        </aside>

        <main class="main-content">
            <div class="header">
                <div>
                    <h1>Premium Management</h1>
                    <div class="subtitle">Manage premium and owner badges</div>
                </div>
                <div class="actions">
                    <input type="text" class="search-input" id="searchInput" placeholder="Search users..." />
                    <select class="filter-select" id="filterSelect">
                        <option value="all">All Users</option>
                        <option value="premium">Premium</option>
                        <option value="owner">Owner</option>
                        <option value="user">Regular</option>
                    </select>
                </div>
            </div>

            <div class="premium-table-container">
                <div id="premiumContent">
                    <div class="loading-state">
                        <div class="spinner"></div>
                        <div>Loading users...</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            function getCookie(name) {
                const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
                return match ? match[2] : null;
            }
            if (!getCookie('admin_auth')) {
                window.location.href = '/admin.auth/';
                return;
            }

            document.getElementById('logoutBtn').addEventListener('click', () => {
                document.cookie = 'admin_auth=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/admin.auth/;';
                window.location.href = '/admin.auth/';
            });

            let currentFilter = 'all';
            let currentSearch = '';
            let page = 0;
            const limit = 20;
            let isLoading = false;
            let hasMore = true;

            const content = document.getElementById('premiumContent');
            const searchInput = document.getElementById('searchInput');
            const filterSelect = document.getElementById('filterSelect');

            async function loadUsers(reset = false) {
                if (isLoading) return;
                if (!reset && !hasMore) return;

                isLoading = true;
                if (reset) {
                    page = 0;
                    hasMore = true;
                    content.innerHTML = `<div class="loading-state"><div class="spinner"></div><div>Loading users...</div></div>`;
                }

                try {
                    const params = new URLSearchParams({
                        filter: currentFilter,
                        search: currentSearch,
                        limit: limit,
                        offset: page * limit
                    });

                    const res = await fetch(`/api/admin/premium?${params}`);
                    if (res.status === 401) { window.location.href = '/admin.auth/'; return; }
                    if (!res.ok) throw new Error('Failed to load users');

                    const data = await res.json();

                    if (reset) {
                        content.innerHTML = buildTable(data.users);
                    } else {
                        content.innerHTML += buildRows(data.users);
                    }

                    hasMore = data.hasMore;
                    page++;
                    isLoading = false;
                    attachEvents();

                } catch (error) {
                    console.error('Error:', error);
                    if (reset) {
                        content.innerHTML = `<div style="text-align:center;padding:40px;color:#dc2626;"><h3>Error loading users</h3><p style="color:#64748b;">${error.message}</p></div>`;
                    }
                    isLoading = false;
                }
            }

            function buildTable(users) {
                if (!users || users.length === 0) {
                    return `<div style="text-align:center;padding:60px;color:#64748b;"><h3>No users found</h3></div>`;
                }
                return `
                    <table class="premium-table">
                        <thead>
                            <tr>
                                <th>User</th>
                                <th>Role</th>
                                <th>Premium Since</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>${buildRows(users)}</tbody>
                    </table>
                `;
            }

            function buildRows(users) {
                return users.map(u => {
                    const roleBadge = u.role === 'premium' ? 'badge-premium' :
                        u.role === 'owner' ? 'badge-owner' : 'badge-user';
                    const roleLabel = u.role === 'premium' ? '⭐ Premium' :
                        u.role === 'owner' ? '👑 Owner' : 'User';

                    return `
                        <tr data-id="${u.id}">
                            <td>
                                <div class="user-info">
                                    <img src="${u.profile_pic || 'https://via.placeholder.com/40'}" onerror="this.src='https://via.placeholder.com/40'" />
                                    <div>
                                        <div class="name">${u.nickname || u.username}</div>
                                        <div class="username">@${u.username}</div>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <span class="badge ${roleBadge}">${roleLabel}</span>
                            </td>
                            <td>${u.premium_since ? new Date(u.premium_since).toLocaleDateString() : '—'}</td>
                            <td>
                                <div class="actions-cell">
                                    ${u.role !== 'premium' ? `<button class="btn-premium" onclick="setRole('${u.id}', 'premium')">⭐ Make Premium</button>` : `<button class="btn-premium active" onclick="setRole('${u.id}', 'user')">⭐ Remove Premium</button>`}
                                    ${u.role !== 'owner' ? `<button class="btn-owner" onclick="setRole('${u.id}', 'owner')">👑 Make Owner</button>` : `<button class="btn-owner active" onclick="setRole('${u.id}', 'user')">👑 Remove Owner</button>`}
                                    ${u.role === 'premium' || u.role === 'owner' ? `<button class="btn-user" onclick="setRole('${u.id}', 'user')">↩️ Reset to User</button>` : ''}
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');
            }

            function attachEvents() {}

            // Search
            let searchTimeout;
            searchInput.addEventListener('input', () => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    currentSearch = searchInput.value;
                    loadUsers(true);
                }, 300);
            });

            // Filter
            filterSelect.addEventListener('change', () => {
                currentFilter = filterSelect.value;
                loadUsers(true);
            });

            // Infinite scroll
            let scrollTimeout;
            window.addEventListener('scroll', () => {
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    const scrollY = window.scrollY;
                    const windowHeight = window.innerHeight;
                    const docHeight = document.documentElement.scrollHeight;
                    if (scrollY + windowHeight >= docHeight - 400) loadUsers();
                }, 100);
            });

            // ===== ACTIONS =====
            window.setRole = async function(userId, role) {
                const confirmMsg = role === 'premium' ? 'Make this user Premium?' :
                    role === 'owner' ? 'Make this user Owner?' :
                    'Remove premium/owner status from this user?';
                if (!confirm(confirmMsg)) return;

                try {
                    const res = await fetch(`/api/admin/premium/${userId}`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ role })
                    });
                    if (res.ok) loadUsers(true);
                    else {
                        const data = await res.json();
                        alert('Failed: ' + (data.error || 'Unknown error'));
                    }
                } catch (e) {
                    alert('Error: ' + e.message);
                }
            };

            // INIT
            loadUsers(true);
        });
    </script>
</body>
</html>
