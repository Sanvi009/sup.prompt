<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login</title>
    
    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .login-card {
            background: white;
            padding: 48px 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
        }

        .login-card .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-card .logo .icon {
            font-size: 40px;
            display: block;
            margin-bottom: 8px;
        }

        .login-card .logo h1 {
            font-size: 24px;
            font-weight: 700;
            color: #111827;
            letter-spacing: -0.025em;
        }

        .login-card .logo p {
            color: #6b7280;
            font-size: 14px;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.2s;
            background: #f9fafb;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
            background: white;
        }

        .form-group input::placeholder {
            color: #9ca3af;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background: #4338ca;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-msg {
            color: #dc2626;
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            display: none;
            padding: 10px;
            background: #fef2f2;
            border-radius: 8px;
            border: 1px solid #fecaca;
        }

        .error-msg.show {
            display: block;
        }

        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .footer-text {
            text-align: center;
            margin-top: 24px;
            color: #6b7280;
            font-size: 13px;
        }

        .footer-text a {
            color: #4f46e5;
            text-decoration: none;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
                margin: 16px;
            }
            .login-card .logo h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo">
            <span class="icon">🛡️</span>
            <h1>Admin Login</h1>
            <p>Enter your credentials to access the admin panel</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input 
                    type="text" 
                    id="username" 
                    placeholder="Enter admin username" 
                    required 
                    autocomplete="off"
                    autofocus
                />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Enter admin password" 
                    required 
                    autocomplete="current-password"
                />
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                Sign In
            </button>

            <div id="errorMsg" class="error-msg">Invalid credentials</div>
        </form>

        <div class="footer-text">
            Secure admin access &bull; Protected area
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('loginForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const submitBtn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');

            // Check if already logged in
            const checkAuth = async () => {
                try {
                    const res = await fetch('/api/admin/check-auth');
                    const data = await res.json();
                    if (data.authenticated) {
                        window.location.href = '/admin.auth/dashboard/';
                    }
                } catch (err) {
                    // Not authenticated, show login
                }
            };
            checkAuth();

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();

                // Basic validation
                if (!username || !password) {
                    showError('Please enter both username and password');
                    return;
                }

                // Show loading state
                setLoadingState(true);
                hideError();

                try {
                    const response = await fetch('/api/admin/auth', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ username, password })
                    });

                    const data = await response.json();

                    if (data.success) {
                        // Set cookie with 24-hour expiry
                        const date = new Date();
                        date.setTime(date.getTime() + (24 * 60 * 60 * 1000));
                        document.cookie = `admin_auth=true; expires=${date.toUTCString()}; path=/admin.auth/; SameSite=Lax`;

                        // Redirect to dashboard
                        window.location.href = '/admin.auth/dashboard/';
                    } else {
                        showError(data.error || 'Invalid credentials');
                        setLoadingState(false);
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    showError('Connection error. Please try again.');
                    setLoadingState(false);
                }
            });

            // Helper functions
            function showError(message) {
                errorMsg.textContent = message;
                errorMsg.classList.add('show');
            }

            function hideError() {
                errorMsg.classList.remove('show');
            }

            function setLoadingState(isLoading) {
                if (isLoading) {
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = '<span class="loading-spinner"></span> Signing in...';
                } else {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign In';
                }
            }

            // Enter key to submit
            passwordInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    form.dispatchEvent(new Event('submit'));
                }
            });
        });
    </script>

</body>
</html>
