<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        .login-card .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 700;
            color: #4f46e5;
            margin-bottom: 8px;
        }
        .login-card h1 {
            text-align: center;
            color: #111827;
            font-size: 24px;
            margin-bottom: 4px;
        }
        .login-card .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 4px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.2s;
            font-family: inherit;
        }
        .form-group input:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .btn-primary:hover {
            background: #4338ca;
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .error-msg {
            color: #dc2626;
            font-size: 14px;
            text-align: center;
            margin-top: 12px;
            display: none;
        }
        .success-msg {
            color: #10b981;
            font-size: 14px;
            text-align: center;
            margin-top: 12px;
            display: none;
        }
        .footer {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: #6b7280;
        }
        @media (max-width: 480px) {
            .login-card { padding: 24px; }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">⚡ Admin Panel</div>
        <h1>Admin Login</h1>
        <p class="subtitle">Enter your admin credentials</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter admin username" required autocomplete="off" />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter admin password" required />
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">Sign In</button>

            <div class="error-msg" id="errorMsg"></div>
            <div class="success-msg" id="successMsg"></div>
        </form>

        <div class="footer">Secure admin access only</div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const username = document.getElementById('username');
        const password = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');

        // ===== CHECK IF ALREADY LOGGED IN =====
        async function checkAdminAuth() {
            try {
                const res = await fetch('/api/admin/auth');
                if (res.ok) {
                    // Already logged in - redirect to dashboard
                    window.location.href = '/admin.auth/dashboard/';
                }
            } catch {
                // Not logged in - show login form
            }
        }

        // ===== LOGIN FORM SUBMIT =====
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';

            const usernameVal = username.value.trim();
            const passwordVal = password.value;

            if (!usernameVal || !passwordVal) {
                errorMsg.textContent = 'Please enter both username and password';
                errorMsg.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
                return;
            }

            try {
                const res = await fetch('/api/check-auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usernameVal, password: passwordVal })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    successMsg.textContent = 'Login successful! Redirecting...';
                    successMsg.style.display = 'block';
                    
                    setTimeout(() => {
                        window.location.href = '/admin.auth/dashboard/';
                    }, 1000);
                } else {
                    errorMsg.textContent = data.error || 'Invalid credentials';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = 'Network error. Please try again.';
                errorMsg.style.display = 'block';
            }

            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign In';
        });

        // ===== INIT =====
        document.addEventListener('DOMContentLoaded', checkAdminAuth);
    </script>
</body>
</html>
