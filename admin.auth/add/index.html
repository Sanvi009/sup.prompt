<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Prompt — Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #f8fafc;
            color: #111827;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 32px 24px;
        }
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            margin-bottom: 24px;
            border-bottom: 1px solid #e2e8f0;
        }
        .top-nav .brand {
            font-size: 22px;
            font-weight: 700;
            color: #111827;
        }
        .top-nav .brand span {
            color: #4f46e5;
        }
        .top-nav .nav-links {
            display: flex;
            gap: 20px;
        }
        .top-nav .nav-links a {
            text-decoration: none;
            color: #64748b;
            font-weight: 500;
            font-size: 14px;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .top-nav .nav-links a:hover {
            background: #f1f5f9;
            color: #111827;
        }
        .top-nav .nav-links a.active {
            background: #eef2ff;
            color: #4f46e5;
        }
        .top-nav .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .top-nav .nav-actions .btn-logout {
            padding: 8px 16px;
            background: #fee2e2;
            color: #dc2626;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }
        .top-nav .nav-actions .btn-logout:hover {
            background: #fecaca;
        }
        .page-header {
            margin-bottom: 24px;
        }
        .page-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #111827;
        }
        .page-header p {
            color: #64748b;
            font-size: 15px;
            margin-top: 4px;
        }
        .form-card {
            background: white;
            padding: 32px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 500;
            font-size: 14px;
            color: #374151;
            margin-bottom: 6px;
        }
        .form-group label .required {
            color: #dc2626;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: white;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .form-group input[type="file"] {
            padding: 8px;
            border: 1px dashed #d1d5db;
            background: #f9fafb;
        }
        .form-group input[type="file"]:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
            outline: none;
        }
        .form-group .helper {
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
        }
        .form-group select[multiple] {
            min-height: 120px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .form-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }
        .form-actions .btn-secondary {
            padding: 10px 20px;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .form-actions .btn-secondary:hover {
            background: #e2e8f0;
        }
        .form-actions .btn-primary {
            padding: 10px 24px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .form-actions .btn-primary:hover {
            background: #4338ca;
            transform: translateY(-1px);
        }
        .form-actions .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .error-box {
            color: #dc2626;
            font-size: 14px;
            text-align: center;
            margin-top: 12px;
        }
        .success-box {
            color: #16a34a;
            font-size: 14px;
            text-align: center;
            margin-top: 12px;
        }

        @media (max-width: 640px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .form-card {
                padding: 20px;
            }
            .top-nav {
                flex-direction: column;
                gap: 12px;
            }
            .top-nav .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Top Nav -->
        <div class="top-nav">
            <div class="brand">📚 <span>Admin</span></div>
            <div class="nav-links">
                <a href="/admin.auth/dashboard/">Dashboard</a>
                <a href="/admin.auth/users/">Users</a>
                <a href="/admin.auth/prompts/">Prompts</a>
                <a href="/admin.auth/add/" class="active">Add Prompt</a>
                <a href="/admin.auth/reports/users/">Reports</a>
                <a href="/admin.auth/premium/">Premium</a>
            </div>
            <div class="nav-actions">
                <button class="btn-logout" id="logoutBtn">Sign Out</button>
            </div>
        </div>

        <!-- Page Header -->
        <div class="page-header">
            <h1>➕ Add New Prompt</h1>
            <p>Create a new AI prompt for your library</p>
        </div>

        <!-- Form -->
        <div class="form-card">
            <form id="addPromptForm">
                <div class="form-group">
                    <label for="title">Title <span class="required">*</span></label>
                    <input type="text" id="title" placeholder="e.g. Cyberpunk City at Night" required />
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" rows="2" placeholder="Short description of the prompt..."></textarea>
                </div>

                <div class="form-group">
                    <label for="promptText">Prompt Text <span class="required">*</span></label>
                    <textarea id="promptText" rows="4" placeholder="The actual AI prompt text..." required></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="mainImage">Main Image <span class="required">*</span></label>
                        <input type="file" id="mainImage" accept="image/*" required />
                        <div class="helper">Required. This will be the cover image.</div>
                    </div>
                    <div class="form-group">
                        <label for="optionalImage">Optional Image</label>
                        <input type="file" id="optionalImage" accept="image/*" />
                        <div class="helper">Optional. Additional image for the prompt.</div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="categorySelect">Categories</label>
                    <select id="categorySelect" multiple>
                        <option value="" disabled>Loading categories...</option>
                    </select>
                    <div class="helper">Hold Ctrl/Cmd to select multiple categories.</div>
                    <div style="display:flex;gap:8px;margin-top:8px;">
                        <input type="text" id="newCategoryInput" placeholder="Add new category..." style="flex:1;padding:8px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;" />
                        <button type="button" id="addCategoryBtn" style="padding:8px 16px;background:#10b981;color:white;border:none;border-radius:6px;font-weight:500;cursor:pointer;font-size:13px;">Add</button>
                    </div>
                </div>

                <div class="error-box" id="errorBox"></div>
                <div class="success-box" id="successBox" style="display:none;"></div>

                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn-primary" id="submitBtn">Create Prompt</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // --- Auth Check ---
        const token = localStorage.getItem('admin_token');
        if (!token) {
            window.location.href = '/admin.auth/';
        }

        // --- Logout ---
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('admin_token');
            window.location.href = '/admin.auth/';
        });

        // --- Cancel ---
        document.getElementById('cancelBtn').addEventListener('click', () => {
            window.location.href = '/admin.auth/prompts/';
        });

        // --- Load Categories ---
        async function loadCategories() {
            const select = document.getElementById('categorySelect');
            select.innerHTML = '<option value="" disabled>Loading categories...</option>';

            try {
                const res = await fetch('/api/admin?action=prompts&sub=list&limit=1', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                // Since we don't have a direct endpoint for categories, 
                // we'll use the supabase client directly from the browser
                // or we can add a new endpoint later
                
                // For now, we'll use the Supabase client directly
                const { createClient } = (await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2')).default;
                
                // Get config
                const configRes = await fetch('/api/supabase-config');
                const config = await configRes.json();
                const supabase = createClient(config.url, config.anonKey);

                const { data, error } = await supabase
                    .from('categories')
                    .select('*')
                    .order('name');

                if (error) throw error;

                select.innerHTML = '';
                data.forEach(cat => {
                    const opt = document.createElement('option');
                    opt.value = cat.id;
                    opt.textContent = cat.name;
                    select.appendChild(opt);
                });

            } catch (err) {
                select.innerHTML = '<option value="" disabled>Error loading categories</option>';
                console.error('Error loading categories:', err);
            }
        }

        // --- Add New Category ---
        document.getElementById('addCategoryBtn').addEventListener('click', async () => {
            const input = document.getElementById('newCategoryInput');
            const name = input.value.trim();
            if (!name) return;

            try {
                const { createClient } = (await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2')).default;
                const configRes = await fetch('/api/supabase-config');
                const config = await configRes.json();
                const supabase = createClient(config.url, config.anonKey);

                const { error } = await supabase
                    .from('categories')
                    .insert({ name });

                if (error) throw error;

                input.value = '';
                loadCategories();

            } catch (err) {
                alert('Error: ' + err.message);
            }
        });

        document.getElementById('newCategoryInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('addCategoryBtn').click();
            }
        });

        // --- Image Upload Helper ---
        async function uploadImage(file, promptId, type) {
            if (!file) return null;

            try {
                const { createClient } = (await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2')).default;
                const configRes = await fetch('/api/supabase-config');
                const config = await configRes.json();
                const supabase = createClient(config.url, config.anonKey);

                const ext = file.name.split('.').pop();
                const path = `${promptId}/${type}.${ext}`;
                
                const { error } = await supabase.storage
                    .from('prompt_images')
                    .upload(path, file, { upsert: true });

                if (error) throw error;

                const { data: urlData } = supabase.storage
                    .from('prompt_images')
                    .getPublicUrl(path);

                return urlData.publicUrl;
            } catch (err) {
                throw new Error('Upload failed: ' + err.message);
            }
        }

        // --- Slug Generator ---
        function generateSlug(title) {
            return title.toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');
        }

        // --- Form Submit ---
        document.getElementById('addPromptForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const errorBox = document.getElementById('errorBox');
            const successBox = document.getElementById('successBox');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating...';
            errorBox.textContent = '';
            successBox.style.display = 'none';

            const title = document.getElementById('title').value.trim();
            const description = document.getElementById('description').value.trim();
            const promptText = document.getElementById('promptText').value.trim();
            const mainFile = document.getElementById('mainImage').files[0];
            const optionalFile = document.getElementById('optionalImage').files[0];
            const select = document.getElementById('categorySelect');
            const selected = Array.from(select.selectedOptions).map(opt => opt.value);

            if (!title || !promptText) {
                errorBox.textContent = 'Title and Prompt Text are required.';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Prompt';
                return;
            }

            if (!mainFile) {
                errorBox.textContent = 'Main Image is required.';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Prompt';
                return;
            }

            try {
                // 1. Generate slug
                let slug = generateSlug(title);

                // 2. Insert prompt (without images first)
                const { createClient } = (await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2')).default;
                const configRes = await fetch('/api/supabase-config');
                const config = await configRes.json();
                const supabase = createClient(config.url, config.anonKey);

                // Check if slug exists
                const { data: existing } = await supabase
                    .from('prompts')
                    .select('slug')
                    .eq('slug', slug)
                    .maybeSingle();

                if (existing) {
                    slug += '-' + Math.random().toString(36).substring(2, 6);
                }

                // Insert prompt
                const { data: newPrompt, error: insertError } = await supabase
                    .from('prompts')
                    .insert({
                        slug,
                        title,
                        description: description || null,
                        prompt_text: promptText,
                        category_ids: selected,
                        image_main: '',
                        image_optional: '',
                        is_published: true,
                        is_boosted: false
                    })
                    .select()
                    .single();

                if (insertError) throw insertError;

                // 3. Upload images
                const mainUrl = await uploadImage(mainFile, newPrompt.id, 'main');
                let optionalUrl = null;
                if (optionalFile) {
                    optionalUrl = await uploadImage(optionalFile, newPrompt.id, 'optional');
                }

                // 4. Update prompt with image URLs
                const { error: updateError } = await supabase
                    .from('prompts')
                    .update({
                        image_main: mainUrl,
                        image_optional: optionalUrl
                    })
                    .eq('id', newPrompt.id);

                if (updateError) throw updateError;

                // Success
                successBox.textContent = '✅ Prompt created successfully!';
                successBox.style.display = 'block';
                errorBox.textContent = '';

                // Reset form
                document.getElementById('addPromptForm').reset();

                // Redirect after 2 seconds
                setTimeout(() => {
                    window.location.href = '/admin.auth/prompts/';
                }, 2000);

            } catch (err) {
                errorBox.textContent = 'Error: ' + err.message;
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Prompt';
            }
        });

        // --- Initial Load ---
        loadCategories();
    </script>
</body>
</html>
