<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add New Prompt</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f1f5f9;
            color: #111827;
        }
        .admin-wrapper { display: flex; min-height: 100vh; }
        
        .sidebar {
            width: 260px;
            background: white;
            border-right: 1px solid #e2e8f0;
            padding: 24px 16px;
            height: 100vh;
            position: sticky;
            top: 0;
            overflow-y: auto;
        }
        .sidebar .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 8px 24px 8px;
            border-bottom: 1px solid #f1f5f9;
            margin-bottom: 24px;
        }
        .sidebar .brand .icon {
            width: 36px;
            height: 36px;
            background: #4f46e5;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
        }
        .sidebar .brand h1 { font-size: 18px; font-weight: 700; color: #111827; }
        .sidebar .nav { display: flex; flex-direction: column; gap: 4px; }
        .sidebar .nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .sidebar .nav a:hover { background: #f1f5f9; color: #111827; }
        .sidebar .nav a.active { background: #eef2ff; color: #4f46e5; font-weight: 600; }
        .sidebar .nav a .emoji { font-size: 18px; width: 24px; text-align: center; }
        .sidebar .logout-btn {
            margin-top: 24px;
            padding: 10px 12px;
            width: 100%;
            background: #fef2f2;
            color: #dc2626;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .sidebar .logout-btn:hover { background: #fee2e2; }

        .main-content { flex: 1; padding: 32px; max-width: calc(100% - 260px); }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }
        .header h1 { font-size: 28px; font-weight: 700; color: #111827; }
        .header .subtitle { color: #64748b; font-size: 14px; margin-top: 4px; }

        .form-card {
            background: white;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            padding: 32px;
            max-width: 720px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .form-card .form-group {
            margin-bottom: 20px;
        }
        .form-card .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 6px;
        }
        .form-card .form-group input,
        .form-card .form-group textarea,
        .form-card .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            background: white;
            transition: border-color 0.2s;
        }
        .form-card .form-group input:focus,
        .form-card .form-group textarea:focus,
        .form-card .form-group select:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
        }
        .form-card .form-group textarea { resize: vertical; min-height: 60px; }
        .form-card .form-group input[type="file"] {
            padding: 6px;
            border: 1px dashed #d1d5db;
            background: #f9fafb;
            cursor: pointer;
        }
        .form-card .form-group select[multiple] {
            min-height: 80px;
            padding: 6px 8px;
        }

        .category-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .category-row input {
            flex: 1;
        }
        .category-row button {
            padding: 8px 16px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .category-row button:hover { background: #059669; }

        .image-preview {
            display: flex;
            gap: 12px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .image-preview img {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid #e2e8f0;
            background: #f1f5f9;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }
        .form-actions .btn-cancel {
            padding: 10px 20px;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .form-actions .btn-cancel:hover { background: #e2e8f0; }
        .form-actions .btn-submit {
            padding: 10px 24px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .form-actions .btn-submit:hover { background: #4338ca; }
        .form-actions .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

        .error-box {
            color: #dc2626;
            font-size: 14px;
            margin-top: 12px;
            text-align: center;
            display: none;
        }
        .error-box.show { display: block; }

        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .admin-wrapper { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: relative; padding: 16px; }
            .main-content { max-width: 100%; padding: 16px; }
            .form-card { padding: 20px; }
            .form-actions { flex-direction: column; }
            .form-actions .btn-cancel, .form-actions .btn-submit { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="admin-wrapper">
        <aside class="sidebar">
            <div class="brand">
                <div class="icon">🛡️</div>
                <h1>Admin Panel</h1>
            </div>
            <nav class="nav">
                <a href="/admin.auth/dashboard/"><span class="emoji">📊</span> Dashboard</a>
                <a href="/admin.auth/users/"><span class="emoji">👥</span> Users</a>
                <a href="/admin.auth/prompts/"><span class="emoji">📝</span> Prompts</a>
                <a href="/admin.auth/add/" class="active"><span class="emoji">➕</span> Add Prompt</a>
                <div class="divider"></div>
                <a href="/admin.auth/reports.u/"><span class="emoji">🚨</span> User Reports</a>
                <a href="/admin.auth/reports.p/"><span class="emoji">⚠️</span> Prompt Reports</a>
                <a href="/admin.auth/premium/"><span class="emoji">⭐</span> Premium</a>
                <button class="logout-btn" id="logoutBtn"><span class="emoji">🚪</span> Sign Out</button>
            </nav>
        </aside>

        <main class="main-content">
            <div class="header">
                <div>
                    <h1>Add New Prompt</h1>
                    <div class="subtitle">Create a new AI prompt for the library</div>
                </div>
            </div>

            <div class="form-card">
                <form id="addPromptForm">
                    <div class="form-group">
                        <label for="title">Title <span style="color:#dc2626;">*</span></label>
                        <input type="text" id="title" placeholder="e.g. Cyberpunk City at Night" required />
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" rows="2" placeholder="Short description of the prompt..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="promptText">Prompt Text <span style="color:#dc2626;">*</span></label>
                        <textarea id="promptText" rows="4" placeholder="The actual AI prompt text..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="mainImage">Main Image <span style="color:#dc2626;">*</span></label>
                        <input type="file" id="mainImage" accept="image/*" required />
                        <div class="image-preview" id="mainImagePreview"></div>
                    </div>

                    <div class="form-group">
                        <label for="optionalImage">Optional Image</label>
                        <input type="file" id="optionalImage" accept="image/*" />
                        <div class="image-preview" id="optionalImagePreview"></div>
                    </div>

                    <div class="form-group">
                        <label for="categorySelect">Categories</label>
                        <select id="categorySelect" multiple size="4">
                            <option value="" disabled>Loading categories...</option>
                        </select>
                        <div class="category-row">
                            <input type="text" id="newCategoryInput" placeholder="New category name..." />
                            <button type="button" id="addCategoryBtn">Add Category</button>
                        </div>
                    </div>

                    <div class="error-box" id="errorBox"></div>

                    <div class="form-actions">
                        <button type="button" class="btn-cancel" onclick="window.location.href='/admin.auth/prompts/'">Cancel</button>
                        <button type="submit" class="btn-submit" id="submitBtn">Create Prompt</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Auth check
            function getCookie(name) {
                const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
                return match ? match[2] : null;
            }
            if (!getCookie('admin_auth')) {
                window.location.href = '/admin.auth/';
                return;
            }

            document.getElementById('logoutBtn').addEventListener('click', () => {
                document.cookie = 'admin_auth=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/admin.auth/;';
                window.location.href = '/admin.auth/';
            });

            // ===== SUPABASE INIT =====
            let sb = null;
            async function initSupabase() {
                const res = await fetch('/api/supabase-config');
                const data = await res.json();
                sb = supabase.createClient(data.url, data.anonKey);
                loadCategories();
            }
            initSupabase();

            // ===== LOAD CATEGORIES =====
            async function loadCategories() {
                const select = document.getElementById('categorySelect');
                if (!sb) return;
                const { data, error } = await sb.from('categories').select('*').order('name');
                if (error) {
                    select.innerHTML = '<option value="" disabled>Error loading categories</option>';
                    return;
                }
                select.innerHTML = '';
                data.forEach(cat => {
                    const opt = document.createElement('option');
                    opt.value = cat.id;
                    opt.textContent = cat.name;
                    select.appendChild(opt);
                });
            }

            // ===== ADD CATEGORY =====
            document.getElementById('addCategoryBtn').addEventListener('click', async () => {
                const input = document.getElementById('newCategoryInput');
                const name = input.value.trim();
                if (!name || !sb) return;
                const { error } = await sb.from('categories').insert({ name });
                if (error) {
                    alert('Error: ' + error.message);
                    return;
                }
                input.value = '';
                loadCategories();
            });

            // ===== IMAGE PREVIEW =====
            function setupImagePreview(inputId, previewId) {
                const input = document.getElementById(inputId);
                const preview = document.getElementById(previewId);
                input.addEventListener('change', () => {
                    preview.innerHTML = '';
                    if (input.files && input.files[0]) {
                        const img = document.createElement('img');
                        img.src = URL.createObjectURL(input.files[0]);
                        preview.appendChild(img);
                    }
                });
            }
            setupImagePreview('mainImage', 'mainImagePreview');
            setupImagePreview('optionalImage', 'optionalImagePreview');

            // ===== UPLOAD IMAGE =====
            async function uploadImage(file, promptId, type) {
                if (!file || !sb) return null;
                const ext = file.name.split('.').pop();
                const path = `${promptId}/${type}.${ext}`;
                const { error } = await sb.storage.from('prompt_images').upload(path, file, { upsert: true });
                if (error) {
                    alert('Upload error: ' + error.message);
                    return null;
                }
                const { data: urlData } = sb.storage.from('prompt_images').getPublicUrl(path);
                return urlData.publicUrl;
            }

            // ===== SUBMIT FORM =====
            const form = document.getElementById('addPromptForm');
            const submitBtn = document.getElementById('submitBtn');
            const errorBox = document.getElementById('errorBox');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorBox.classList.remove('show');

                const title = document.getElementById('title').value.trim();
                const description = document.getElementById('description').value.trim();
                const promptText = document.getElementById('promptText').value.trim();
                const mainFile = document.getElementById('mainImage').files[0];
                const optionalFile = document.getElementById('optionalImage').files[0];
                const selected = document.getElementById('categorySelect').selectedOptions;
                const categoryIds = Array.from(selected).map(opt => opt.value);

                if (!title || !promptText || !mainFile) {
                    errorBox.textContent = 'Title, Prompt Text, and Main Image are required.';
                    errorBox.classList.add('show');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="loading-spinner"></span> Creating...';

                try {
                    // 1. Create prompt in DB
                    const res = await fetch('/api/admin/prompts', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            title,
                            description,
                            prompt_text: promptText,
                            category_ids: categoryIds,
                            image_main: '',
                            image_optional: ''
                        })
                    });

                    if (!res.ok) {
                        const err = await res.json();
                        throw new Error(err.error || 'Failed to create prompt');
                    }

                    const newPrompt = await res.json();

                    // 2. Upload images
                    const mainUrl = await uploadImage(mainFile, newPrompt.id, 'main');
                    let optionalUrl = null;
                    if (optionalFile) {
                        optionalUrl = await uploadImage(optionalFile, newPrompt.id, 'optional');
                    }

                    // 3. Update prompt with image URLs
                    const updateRes = await fetch(`/api/admin/prompts/${newPrompt.id}`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            image_main: mainUrl,
                            image_optional: optionalUrl
                        })
                    });

                    if (!updateRes.ok) {
                        throw new Error('Failed to update images');
                    }

                    // 4. Redirect to prompt list
                    window.location.href = '/admin.auth/prompts/';

                } catch (error) {
                    errorBox.textContent = 'Error: ' + error.message;
                    errorBox.classList.add('show');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Create Prompt';
                }
            });
        });
    </script>
</body>
</html>
