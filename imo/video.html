<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pron tube</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f0f0f;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            padding: 1.5rem;
        }

        .site-name {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: -0.03em;
            color: #fff;
            margin-bottom: 1.5rem;
        }

        .site-name span {
            color: #ff2c2c;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .video-card {
            display: block;
            position: relative;
            aspect-ratio: 4 / 3;
            overflow: hidden;
            background: #1e1e1e;
            text-decoration: none;
        }

        .video-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .video-card img.loaded {
            opacity: 1;
        }

        /* play button – centered */
        .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            pointer-events: none;
        }

        .play-icon::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-40%, -50%);
            border-style: solid;
            border-width: 10px 0 10px 18px;
            border-color: transparent transparent transparent #0f0f0f;
        }

        /* duration badge – bottom right */
        .duration-badge {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 2px 5px;
            border-radius: 4px;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            .site-name { font-size: 2.2rem; }
            .video-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
            .play-icon { width: 40px; height: 40px; }
            .play-icon::after { border-width: 8px 0 8px 14px; }
            .duration-badge { font-size: 0.65rem; }
        }
    </style>
</head>
<body>
    <div class="site-name">porn<span>Tube</span></div>
    <div class="video-grid" id="videoGrid"></div>

    <script>
        // ---- CONFIG ----
        const TOTAL_UNIQUE_IMAGES = 61;       // ← change to 50 later
        const REDIRECT_URL = 'https://www.profitableratecpmnetwork.com/d8y1vhs4?key=31fcdb6bd1fdef5eec81591018ae3426';
        const IMAGE_BASE_PATH = '/imo/video';
        const IMAGE_EXTENSION = 'jpg';        // ← extension here (jpg, jpeg, png, webp)

        const grid = document.getElementById('videoGrid');
        const fragment = document.createDocumentFragment();

        // random duration between 2:00 and 5:00
        function randomDuration() {
            const total = Math.floor(Math.random() * 181) + 120; // 120–300s
            const m = Math.floor(total / 60);
            const s = total % 60;
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        // build cards – one per image, no loop
        for (let i = 1; i <= TOTAL_UNIQUE_IMAGES; i++) {
            const card = document.createElement('a');
            card.className = 'video-card';
            card.href = REDIRECT_URL;
            card.target = '_blank';
            card.rel = 'noopener noreferrer';

            const img = document.createElement('img');
            img.dataset.src = `${IMAGE_BASE_PATH}/${i}.${IMAGE_EXTENSION}`;
            img.alt = `Video ${i}`;
            img.loading = 'lazy';
            img.decoding = 'async';

            const play = document.createElement('div');
            play.className = 'play-icon';

            const dur = document.createElement('div');
            dur.className = 'duration-badge';
            dur.textContent = randomDuration();

            card.append(img, play, dur);
            fragment.appendChild(card);
        }
        grid.appendChild(fragment);

        // lazy load
        const observer = new IntersectionObserver((entries, obs) => {
            entries.forEach(entry => {
                if (!entry.isIntersecting) return;
                const img = entry.target;
                img.src = img.dataset.src;
                img.removeAttribute('data-src');
                img.addEventListener('load', () => img.classList.add('loaded'), { once: true });
                img.addEventListener('error', () => img.classList.add('loaded'), { once: true });
                obs.unobserve(img);
            });
        }, { rootMargin: '300px' });

        grid.querySelectorAll('img[data-src]').forEach(img => observer.observe(img));
    </script>
</body>
</html>
