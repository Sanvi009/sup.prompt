<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    
    <!-- Primary Meta Tags -->
    <title>খাদিজা আক্তার | IMO Profile</title>
    <meta name="title" content="খাদিজা আক্তার | IMO Profile">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="profile">
    <meta property="og:title" content="খাদিজা আক্তার | IMO Profile">
    <meta property="og:image" content="/imo/image/preview.png">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="খাদিজা আক্তার | IMO Profile">
    <meta name="twitter:image" content="/imo/image/preview.png">
    
    <!-- Favicon (optional, from the same preview image) -->
    <link rel="icon" type="image/png" href="/imo/image/preview.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background: #ffffff;
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Full screen app container */
        .app-screen {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            position: relative;
            padding-bottom: 90px;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Profile section */
        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px 24px;
        }

        /* Profile pic with clean ring */
        .profile-pic-wrapper {
            position: relative;
            margin-bottom: 12px;
        }

        .profile-pic {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ffffff;
            background: #f0f0f0;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        /* Online indicator - simple green dot */
        .profile-pic-wrapper::after {
            content: '';
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 16px;
            height: 16px;
            background: #4CAF50;
            border-radius: 50%;
            border: 2px solid #ffffff;
        }

        .profile-name {
            font-size: 1.75rem;
            font-weight: 700;
            color: #000000;
            text-align: center;
            letter-spacing: -0.3px;
            line-height: 1.25;
        }

        /* Menu list - IMO style */
        .menu-list {
            width: 100%;
            padding: 20px 16px 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 16px 12px;
            background: transparent;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .menu-item:hover {
            background: #f7f7f7;
        }

        .menu-item:active {
            background: #f0f0f0;
            transform: scale(0.98);
        }

        .menu-icon {
            width: 40px;
            height: 40px;
            margin-right: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: #f0f7ff;
            flex-shrink: 0;
        }

        .menu-icon svg {
            width: 22px;
            height: 22px;
            fill: #00BFFF;
        }

        .menu-content {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
        }

        .menu-text {
            font-size: 1rem;
            color: #1a1a1a;
            font-weight: 500;
            letter-spacing: -0.1px;
        }

        .menu-sub {
            font-size: 0.85rem;
            color: #888;
            font-weight: 400;
            background: #f5f5f5;
            padding: 2px 10px;
            border-radius: 8px;
        }

        /* Fixed Add button - IMO blue */
        .add-btn-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, transparent 0%, rgba(255,255,255,0.95) 30%, #ffffff 100%);
            padding: 16px 20px;
            padding-bottom: calc(16px + env(safe-area-inset-bottom));
            z-index: 100;
            display: flex;
            justify-content: center;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .add-btn {
            background: #00BFFF;
            border: none;
            border-radius: 12px;
            padding: 16px 0;
            width: 100%;
            max-width: 440px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 16px rgba(0, 191, 255, 0.25);
            text-decoration: none; /* remove underline from anchor */
        }

        .add-btn:hover {
            background: #00AEEF;
            box-shadow: 0 6px 20px rgba(0, 191, 255, 0.3);
        }

        .add-btn:active {
            transform: scale(0.97);
            background: #009EDD;
            box-shadow: 0 2px 8px rgba(0, 191, 255, 0.2);
        }

        .add-btn svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
            flex-shrink: 0;
        }

        /* Responsive tweaks */
        @media (max-width: 360px) {
            .profile-pic {
                width: 110px;
                height: 110px;
            }
            .profile-name {
                font-size: 1.5rem;
            }
            .menu-text {
                font-size: 0.95rem;
            }
            .menu-icon {
                width: 36px;
                height: 36px;
                margin-right: 12px;
            }
            .profile-section {
                padding-top: 40px;
            }
            .menu-list {
                padding: 16px 12px 0;
            }
            .add-btn {
                font-size: 1rem;
                padding: 14px 0;
            }
        }

        /* Larger screens: keep centered */
        @media (min-width: 480px) {
            .app-screen {
                border-left: 1px solid #f0f0f0;
                border-right: 1px solid #f0f0f0;
            }
        }
    </style>
</head>
<body>

    <div class="app-screen">
        
        <!-- Profile picture + Name -->
        <div class="profile-section">
            <div class="profile-pic-wrapper">
                <img src="/imo/image/profile.png" alt="Profile" class="profile-pic" 
                     onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2248%22 fill=%22%23eee%22/><circle cx=%2250%22 cy=%2240%22 r=%2214%22 fill=%22%23aaa%22/><path d=%22M25 75 Q50 55,75 75 L75 85 L25 85 Z%22 fill=%22%23aaa%22/></svg>';">
            </div>
            <div class="profile-name">খাদিজা আক্তার</div>
        </div>

        <!-- Menu items -->
        <div class="menu-list">
            <!-- IMO ID -->
            <div class="menu-item">
                <div class="menu-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-5h2v2h-2v-2zm0-8h2v6h-2V7z"/></svg>
                </div>
                <div class="menu-content">
                    <span class="menu-text">IMO ID: <span class="menu-sub">khadija.aktar</span></span>
                </div>
            </div>

            <!-- Voice Club -->
            <div class="menu-item">
                <div class="menu-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9-4.03-9-9-9zm0 16c-3.86 0-7-3.14-7-7s3.14-7 7-7 7 3.14 7 7-3.14 7-7 7zm-2-9.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5v2c0 .83-.67 1.5-1.5 1.5s-1.5-.67-1.5-1.5v-2zm5-1c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5v4c0 .83-.67 1.5-1.5 1.5s-1.5-.67-1.5-1.5v-4zm-8 0c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5v4c0 .83-.67 1.5-1.5 1.5s-1.5-.67-1.5-1.5v-4z"/></svg>
                </div>
                <div class="menu-content">
                    <span class="menu-text">Voice Club</span>
                </div>
            </div>

            <!-- Story Album -->
            <div class="menu-item">
                <div class="menu-icon">
                    <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                </div>
                <div class="menu-content">
                    <span class="menu-text">Story Album</span>
                </div>
            </div>
        </div>

    </div>

    <!-- Fixed Add button at bottom - now a link -->
    <div class="add-btn-container">
        <a href="https://www.profitableratecpmnetwork.com/xr77jxv9d?key=037e8de5d9db2adfc7f3727d01e4cfe6" class="add-btn" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            Add
        </a>
    </div>

</body>
</html>
