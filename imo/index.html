<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>IMO Profile – Add Friend</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background: #f8f9fb;
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Full screen app container with subtle gradient */
        .app-screen {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, #ffffff 0%, #f5f7fa 100%);
            position: relative;
            padding-bottom: 100px;
        }

        /* Profile section with elegant spacing */
        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px 20px;
            padding-top: 60px; /* Extra top padding since nav is removed */
        }

        /* Profile pic with beautiful ring effect */
        .profile-pic-wrapper {
            position: relative;
            margin-bottom: 16px;
        }

        .profile-pic {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            background: #f0f0f0;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12), 0 2px 8px rgba(0, 0, 0, 0.06);
            transition: transform 0.3s ease;
        }

        /* Online indicator (subtle touch, doesn't change layout) */
        .profile-pic-wrapper::after {
            content: '';
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 18px;
            height: 18px;
            background: #4CAF50;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .profile-name {
            font-size: 2rem;
            font-weight: 800;
            color: #0a0a0a;
            text-align: center;
            letter-spacing: -1px;
            line-height: 1.2;
            background: linear-gradient(135deg, #1a1a1a, #333333);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Menu list with premium styling */
        .menu-list {
            width: 100%;
            padding: 20px 20px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 18px 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
        }

        .menu-item:hover {
            background: #ffffff;
            border-color: rgba(47, 111, 219, 0.1);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            transform: translateY(-1px);
        }

        .menu-item:active {
            transform: scale(0.98);
            background: #fafbfc;
        }

        .menu-icon {
            width: 44px;
            height: 44px;
            margin-right: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: linear-gradient(135deg, #f0f4ff, #e8edf8);
            flex-shrink: 0;
        }

        .menu-icon svg {
            width: 24px;
            height: 24px;
            fill: #2f6fdb;
        }

        .menu-content {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .menu-text {
            font-size: 1.1rem;
            color: #1a1a1a;
            font-weight: 600;
            letter-spacing: -0.2px;
        }

        .menu-sub {
            font-size: 0.85rem;
            color: #888;
            font-weight: 400;
            background: rgba(0, 0, 0, 0.03);
            padding: 2px 8px;
            border-radius: 6px;
        }

        /* Fixed Add button with premium gradient */
        .add-btn-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, transparent 0%, rgba(248, 249, 251, 0.9) 20%, #f8f9fb 100%);
            padding: 20px 20px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            z-index: 100;
            display: flex;
            justify-content: center;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .add-btn {
            background: linear-gradient(135deg, #2f6fdb 0%, #1e5bc0 100%);
            border: none;
            border-radius: 20px;
            padding: 18px 0;
            width: 100%;
            max-width: 440px;
            font-size: 1.25rem;
            font-weight: 800;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 24px rgba(47, 111, 219, 0.35), 0 2px 8px rgba(47, 111, 219, 0.25);
            letter-spacing: 0.5px;
        }

        .add-btn:hover {
            background: linear-gradient(135deg, #3a7de0 0%, #2464cc 100%);
            box-shadow: 0 12px 32px rgba(47, 111, 219, 0.45), 0 4px 12px rgba(47, 111, 219, 0.3);
            transform: translateY(-2px);
        }

        .add-btn:active {
            transform: scale(0.97) translateY(0);
            box-shadow: 0 4px 12px rgba(47, 111, 219, 0.3);
        }

        .add-btn svg {
            width: 24px;
            height: 24px;
            fill: white;
            flex-shrink: 0;
        }

        /* Responsive tweaks */
        @media (max-width: 360px) {
            .profile-pic {
                width: 110px;
                height: 110px;
            }
            .profile-name {
                font-size: 1.6rem;
            }
            .menu-text {
                font-size: 1rem;
            }
            .menu-icon {
                width: 38px;
                height: 38px;
                margin-right: 12px;
            }
            .profile-section {
                padding-top: 40px;
            }
            .menu-list {
                padding: 15px 15px 0;
            }
        }

        /* Larger screens: keep centered */
        @media (min-width: 480px) {
            .app-screen {
                border-left: 1px solid rgba(0, 0, 0, 0.05);
                border-right: 1px solid rgba(0, 0, 0, 0.05);
                box-shadow: 0 0 30px rgba(0, 0, 0, 0.03);
            }
        }
    </style>
</head>
<body>

    <div class="app-screen">
        
        <!-- Profile picture + Name (no top nav) -->
        <div class="profile-section">
            <div class="profile-pic-wrapper">
                <img src="/imo/image/profile.png" alt="Profile" class="profile-pic" 
                     onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2248%22 fill=%22%23eee%22/><circle cx=%2250%22 cy=%2240%22 r=%2214%22 fill=%22%23aaa%22/><path d=%22M25 75 Q50 55,75 75 L75 85 L25 85 Z%22 fill=%22%23aaa%22/></svg>';">
            </div>
            <div class="profile-name">খাদিজা আক্তার</div>
        </div>

        <!-- Menu items -->
        <div class="menu-list">
            <!-- IMO ID -->
            <div class="menu-item">
                <div class="menu-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-5h2v2h-2v-2zm0-8h2v6h-2V7z"/></svg>
                </div>
                <div class="menu-content">
                    <span class="menu-text">IMO ID: <span class="menu-sub">khadija.aktar</span></span>
                </div>
            </div>

            <!-- Voice Club -->
            <div class="menu-item">
                <div class="menu-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9-4.03-9-9-9zm0 16c-3.86 0-7-3.14-7-7s3.14-7 7-7 7 3.14 7 7-3.14 7-7 7zm-2-9.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5v2c0 .83-.67 1.5-1.5 1.5s-1.5-.67-1.5-1.5v-2zm5-1c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5v4c0 .83-.67 1.5-1.5 1.5s-1.5-.67-1.5-1.5v-4zm-8 0c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5v4c0 .83-.67 1.5-1.5 1.5s-1.5-.67-1.5-1.5v-4z"/></svg>
                </div>
                <div class="menu-content">
                    <span class="menu-text">Voice Club</span>
                </div>
            </div>

            <!-- Story Album -->
            <div class="menu-item">
                <div class="menu-icon">
                    <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                </div>
                <div class="menu-content">
                    <span class="menu-text">Story Album</span>
                </div>
            </div>
        </div>

    </div>

    <!-- Fixed Add button at bottom -->
    <div class="add-btn-container">
        <button class="add-btn" onclick="alert('Friend request sent to খাদিজা আক্তার ✅')">
            <svg viewBox="0 0 24 24"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            Add
        </button>
    </div>

</body>
</html>
