<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/asset/icon.png" />
    <link rel="shortcut icon" href="/asset/icon.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single&display=swap');
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        /* ===== RESET & BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #f0f0f0;
            color: #1a1a1a;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 24px 16px 80px;
        }

        /* ===== BRANDED BACK BUTTON ===== */
        .back {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            color: #1a1a1a;
            text-decoration: none;
            font-family: 'Bitcount Prop Single', serif;
            font-size: 24px;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: opacity 0.2s;
        }
        .back:hover { opacity: 0.6; }
        .back img.icon {
            width: 32px;
            height: 32px;
            object-fit: contain;
            display: block;
        }
        .back span { color: #4f46e5; }

        /* ===== CARD (Skeuomorphic) ===== */
        .card {
            background: #e8ecf1;
            border-radius: 24px;
            padding: 28px 32px;
            box-shadow: 
                12px 12px 24px rgba(0,0,0,0.08),
                -12px -12px 24px rgba(255,255,255,0.6);
            margin-bottom: 20px;
            border: none;
        }
        .card h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 20px;
            letter-spacing: -0.3px;
        }

        /* ===== AVATAR SECTION ===== */
        .avatar-section {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .avatar-section .avatar-wrap {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #e8ecf1;
            border: 3px solid #e0e0e0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 600;
            color: #4f46e5;
            box-shadow: 
                inset 4px 4px 8px rgba(0,0,0,0.06),
                inset -4px -4px 8px rgba(255,255,255,0.7);
        }
        .avatar-section .avatar-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .avatar-section .avatar-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .avatar-section .avatar-actions .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 
                2px 2px 6px rgba(0,0,0,0.06),
                -2px -2px 4px rgba(255,255,255,0.4);
        }
        .avatar-section .avatar-actions .btn-primary {
            background: #4f46e5;
            color: white;
        }
        .avatar-section .avatar-actions .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 4px 4px 10px rgba(79,70,229,0.2);
        }
        .avatar-section .avatar-actions .btn-danger {
            background: #fee2e2;
            color: #dc2626;
        }
        .avatar-section .avatar-actions .btn-danger:hover {
            transform: translateY(-1px);
            box-shadow: 4px 4px 10px rgba(220,38,38,0.1);
        }

        /* ===== FORM GROUPS ===== */
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: #1a1a1a;
            margin-bottom: 6px;
        }
        .form-group .helper {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            background: #e8ecf1;
            box-shadow: 
                inset 4px 4px 8px rgba(0,0,0,0.06),
                inset -4px -4px 8px rgba(255,255,255,0.7);
            transition: all 0.2s;
            color: #1a1a1a;
            outline: none;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            box-shadow: 
                inset 6px 6px 10px rgba(0,0,0,0.08),
                inset -6px -6px 10px rgba(255,255,255,0.9),
                0 0 0 2px #4f46e5;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* ===== FORM ACTIONS ===== */
        .form-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }
        .form-actions .btn-secondary {
            padding: 10px 20px;
            background: #e0e0e0;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.06);
        }
        .form-actions .btn-secondary:hover {
            background: #d0d0d0;
            transform: translateY(-1px);
        }
        .form-actions .btn-primary {
            padding: 10px 24px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 2px 2px 6px rgba(79,70,229,0.2);
        }
        .form-actions .btn-primary:hover {
            background: #4338ca;
            transform: translateY(-1px);
            box-shadow: 4px 4px 10px rgba(79,70,229,0.2);
        }
        .form-actions .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== MESSAGES ===== */
        .error-box {
            color: #dc2626;
            font-size: 14px;
            text-align: center;
            margin-top: 12px;
        }
        .success-box {
            color: #16a34a;
            font-size: 14px;
            text-align: center;
            margin-top: 12px;
            display: none;
        }

        /* ===== LOADING & SKELETON ===== */
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .loading .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid #e0e0e0;
            border-top-color: #4f46e5;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.04);
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== SKELETON LOADING ANIMATION ===== */
        .skeleton {
            background: linear-gradient(90deg, #e8ecf1 25%, #d5d9e0 50%, #e8ecf1 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .skeleton-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
        }
        .skeleton-text {
            height: 16px;
            border-radius: 8px;
            margin: 4px 0;
        }
        .skeleton-text.short { width: 120px; }
        .skeleton-text.long { width: 220px; }
        .skeleton-text.full { width: 100%; }

        .skeleton-settings {
            background: #e8ecf1;
            border-radius: 24px;
            padding: 28px 32px;
            box-shadow: 
                12px 12px 24px rgba(0,0,0,0.08),
                -12px -12px 24px rgba(255,255,255,0.6);
            margin-bottom: 20px;
        }
        .skeleton-settings .header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }
        .skeleton-settings .header .info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }
        .skeleton-settings .fields {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .skeleton-settings .fields .row {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* ===== AVATAR PICKER MODAL ===== */
        .picker-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .picker-overlay.active { display: flex; }

        .picker-modal {
            background: #e8ecf1;
            border-radius: 24px;
            padding: 24px 28px;
            max-width: 520px;
            width: 94%;
            max-height: 85vh;
            box-shadow: 
                16px 16px 32px rgba(0,0,0,0.10),
                -16px -16px 32px rgba(255,255,255,0.6);
            display: flex;
            flex-direction: column;
        }
        .picker-modal h2 {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 4px;
        }
        .picker-modal p {
            font-size: 14px;
            color: #666;
            margin-bottom: 16px;
        }

        .picker-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            overflow-y: auto;
            padding: 4px 2px 12px;
            flex: 1;
        }
        .picker-grid .avatar-option {
            position: relative;
            width: 100%;
            padding-bottom: 100%;
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
            background: #e8ecf1;
            border: 3px solid transparent;
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.04);
            transition: all 0.15s;
        }
        .picker-grid .avatar-option img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .picker-grid .avatar-option:hover {
            transform: scale(1.04);
        }
        .picker-grid .avatar-option.selected {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79,70,229,0.15);
        }

        .picker-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #d0d0d0;
        }
        .picker-actions .btn-secondary {
            padding: 10px 20px;
            background: #e0e0e0;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.06);
        }
        .picker-actions .btn-secondary:hover {
            background: #d0d0d0;
        }
        .picker-actions .btn-primary {
            padding: 10px 24px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 2px 2px 6px rgba(79,70,229,0.2);
        }
        .picker-actions .btn-primary:hover {
            background: #4338ca;
        }
        .picker-actions .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .picker-loading {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding: 12px 0;
        }
        .picker-loading .skeleton-opt {
            width: calc(25% - 9px);
            padding-bottom: calc(25% - 9px);
            border-radius: 50%;
            background: linear-gradient(90deg, #e0e0e0 25%, #d0d0d0 50%, #e0e0e0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.2s infinite;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .card { padding: 20px; }
            .avatar-section { flex-direction: column; align-items: flex-start; gap: 12px; }
            .avatar-section .avatar-wrap { width: 64px; height: 64px; font-size: 26px; }
            .form-actions { flex-direction: column; }
            .form-actions .btn-secondary,
            .form-actions .btn-primary { width: 100%; text-align: center; }
            .picker-grid { grid-template-columns: repeat(4, 1fr); gap: 10px; }
            .picker-modal { padding: 20px; }
        }
        @media (max-width: 420px) {
            .container { padding: 16px 10px 60px; }
            .card { padding: 16px; }
            .card h1 { font-size: 20px; }
            .picker-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- BRANDED BACK BUTTON -->
        <a href="/feed/" class="back">
            <img src="/asset/icon.png" class="icon" alt="Icon" onerror="this.style.display='none'" />
            <span>spairogram</span>
        </a>
        
        <div id="content">
            <!-- Skeleton will be rendered by JavaScript -->
        </div>
    </div>

    <!-- ===== AVATAR PICKER MODAL ===== -->
    <div class="picker-overlay" id="pickerOverlay">
        <div class="picker-modal">
            <h2>Choose Avatar</h2>
            <p>Select an avatar from the collection below.</p>
            <div id="pickerGrid" class="picker-grid">
                <div class="picker-loading" id="pickerLoading">
                    <div class="skeleton-opt"></div>
                    <div class="skeleton-opt"></div>
                    <div class="skeleton-opt"></div>
                    <div class="skeleton-opt"></div>
                    <div class="skeleton-opt"></div>
                    <div class="skeleton-opt"></div>
                    <div class="skeleton-opt"></div>
                    <div class="skeleton-opt"></div>
                </div>
            </div>
            <div class="picker-actions">
                <button class="btn-secondary" id="pickerCancelBtn">Cancel</button>
                <button class="btn-primary" id="pickerSelectBtn" disabled>Select</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  STATE (unchanged)
        // ============================================================
        const token = localStorage.getItem('user_token');
        let currentUser = null;
        let selectedAvatarUrl = null;

        // ============================================================
        //  DOM
        // ============================================================
        const container = document.getElementById('content');
        const pickerOverlay = document.getElementById('pickerOverlay');
        const pickerGrid = document.getElementById('pickerGrid');
        const pickerLoading = document.getElementById('pickerLoading');
        const pickerSelectBtn = document.getElementById('pickerSelectBtn');
        const pickerCancelBtn = document.getElementById('pickerCancelBtn');

        // ============================================================
        //  VERIFY USER (unchanged)
        // ============================================================
        async function verifyUser() {
            if (!token) {
                window.location.href = '/';
                return;
            }
            try {
                const res = await fetch('/api/auth?action=verify', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.success) {
                    currentUser = data.user;
                    return currentUser;
                } else {
                    localStorage.removeItem('user_token');
                    window.location.href = '/';
                }
            } catch {
                localStorage.removeItem('user_token');
                window.location.href = '/';
            }
        }

        // ============================================================
        //  RENDER SKELETON (RESTORED)
        // ============================================================
        function renderSkeleton() {
            container.innerHTML = `
                <div class="skeleton-settings">
                    <div class="header">
                        <div class="skeleton skeleton-avatar"></div>
                        <div class="info">
                            <div class="skeleton skeleton-text short"></div>
                            <div class="skeleton skeleton-text long"></div>
                        </div>
                    </div>
                    <div class="fields">
                        <div class="row">
                            <div class="skeleton skeleton-text short"></div>
                            <div class="skeleton skeleton-text full"></div>
                        </div>
                        <div class="row">
                            <div class="skeleton skeleton-text short"></div>
                            <div class="skeleton skeleton-text full" style="height:60px;"></div>
                        </div>
                        <div class="row">
                            <div class="skeleton skeleton-text short"></div>
                            <div class="skeleton skeleton-text full"></div>
                        </div>
                        <div class="row">
                            <div class="skeleton skeleton-text short"></div>
                            <div class="skeleton skeleton-text full"></div>
                        </div>
                        <div class="row">
                            <div class="skeleton skeleton-text short"></div>
                            <div class="skeleton skeleton-text full"></div>
                        </div>
                    </div>
                    <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:24px;">
                        <div class="skeleton" style="width:100px;height:40px;border-radius:8px;"></div>
                        <div class="skeleton" style="width:120px;height:40px;border-radius:8px;"></div>
                    </div>
                </div>
            `;
        }

        // ============================================================
        //  LOAD PROFILE (unchanged)
        // ============================================================
        async function loadProfile() {
            try {
                const res = await fetch('/api/profile', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                if (!data.profile) {
                    container.innerHTML = `<div class="loading">❌ Profile not found</div>`;
                    return;
                }

                renderSettings(data.profile);
            } catch (err) {
                container.innerHTML = `<div class="loading">❌ Error loading profile</div>`;
                console.error(err);
            }
        }

        // ============================================================
        //  RENDER SETTINGS FORM (NEW: Added email and phone fields)
        // ============================================================
        function renderSettings(profile) {
            // REMOVED FALLBACK: avatar_url is never null
            const avatarUrl = profile.avatar_url;
            const displayName = profile.display_name || profile.username;

            container.innerHTML = `
                <div class="card">
                    <h1>Edit Profile</h1>

                    <div class="avatar-section">
                        <div class="avatar-wrap" id="avatarPreview">
                            ${profile.avatar_url ? `<img src="${avatarUrl}" alt="Avatar" />` : displayName.charAt(0).toUpperCase()}
                        </div>
                        <div class="avatar-actions">
                            <button class="btn btn-primary" id="chooseAvatarBtn">Choose Avatar</button>
                            ${profile.avatar_url ? `<button class="btn btn-danger" id="avatarRemoveBtn">Remove</button>` : ''}
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="displayName">Display Name</label>
                        <input type="text" id="displayName" value="${profile.display_name || ''}" placeholder="Your display name" />
                        <div class="helper">Can be changed twice a week.</div>
                    </div>

                    <div class="form-group">
                        <label for="bio">Bio</label>
                        <textarea id="bio" rows="3" placeholder="Tell us about yourself...">${profile.bio || ''}</textarea>
                    </div>

                    <!-- NEW: Email Field -->
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" value="${profile.email || ''}" placeholder="your@email.com" />
                        <div class="helper">Only visible to you.</div>
                    </div>

                    <!-- NEW: Phone Number Field -->
                    <div class="form-group">
                        <label for="phoneNumber">Phone Number</label>
                        <input type="tel" id="phoneNumber" value="${profile.phone_number || ''}" placeholder="+1 234 567 890" />
                        <div class="helper">Only visible to you.</div>
                    </div>

                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" value="${profile.username}" placeholder="Username" />
                        <div class="helper">Can be changed once a month. This is your @handle.</div>
                    </div>

                    <div class="error-box" id="errorBox"></div>
                    <div class="success-box" id="successBox">✅ Profile updated successfully!</div>

                    <div class="form-actions">
                        <button class="btn-secondary" id="cancelBtn">Cancel</button>
                        <button class="btn-primary" id="saveBtn">Save Changes</button>
                    </div>
                </div>
            `;

            // --- Event listeners (unchanged + picker) ---
            document.getElementById('cancelBtn').addEventListener('click', () => {
                window.location.href = `/@${currentUser.username}`;
            });

            document.getElementById('saveBtn').addEventListener('click', handleSave);

            document.getElementById('chooseAvatarBtn').addEventListener('click', openAvatarPicker);

            const removeBtn = document.getElementById('avatarRemoveBtn');
            if (removeBtn) {
                removeBtn.addEventListener('click', handleAvatarRemove);
            }
        }

        // ============================================================
        //  OPEN AVATAR PICKER (unchanged)
        // ============================================================
        async function openAvatarPicker() {
            selectedAvatarUrl = null;
            pickerSelectBtn.disabled = true;
            pickerOverlay.classList.add('active');

            // Show loading
            pickerLoading.style.display = 'flex';
            pickerGrid.innerHTML = '';
            pickerGrid.appendChild(pickerLoading);

            try {
                const configRes = await fetch('/api/supabase-config');
                const config = await configRes.json();
                const s = supabase.createClient(config.url, config.anonKey);

                const { data: fileList, error } = await s.storage
                    .from('user_avatars')
                    .list('', { limit: 100, offset: 0 });

                if (error) throw error;
                if (!fileList || fileList.length === 0) {
                    pickerLoading.style.display = 'none';
                    pickerGrid.innerHTML = `<p style="grid-column:1/-1;text-align:center;color:#666;padding:20px 0;">No avatars available.</p>`;
                    return;
                }

                pickerLoading.style.display = 'none';
                pickerGrid.innerHTML = '';

                const currentAvatarUrl = document.getElementById('avatarPreview').querySelector('img')?.src || null;

                fileList.forEach(file => {
                    const publicUrl = s.storage
                        .from('user_avatars')
                        .getPublicUrl(file.name).data.publicUrl;

                    const div = document.createElement('div');
                    div.className = 'avatar-option';
                    if (currentAvatarUrl && currentAvatarUrl === publicUrl) {
                        div.classList.add('selected');
                        selectedAvatarUrl = publicUrl;
                        pickerSelectBtn.disabled = false;
                    }
                    div.dataset.url = publicUrl;

                    div.innerHTML = `<img src="${publicUrl}" alt="Avatar" loading="lazy" onerror="this.parentElement.remove();" />`;

                    div.addEventListener('click', () => {
                        document.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('selected'));
                        div.classList.add('selected');
                        selectedAvatarUrl = publicUrl;
                        pickerSelectBtn.disabled = false;
                    });

                    pickerGrid.appendChild(div);
                });

            } catch (err) {
                pickerLoading.style.display = 'none';
                pickerGrid.innerHTML = `<p style="grid-column:1/-1;text-align:center;color:#dc2626;padding:20px 0;">Error loading avatars.</p>`;
                console.error(err);
            }
        }

        // ============================================================
        //  PICKER CANCEL (unchanged)
        // ============================================================
        pickerCancelBtn.addEventListener('click', () => {
            pickerOverlay.classList.remove('active');
            selectedAvatarUrl = null;
            pickerSelectBtn.disabled = true;
        });

        // Close on backdrop click
        pickerOverlay.addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                pickerOverlay.classList.remove('active');
                selectedAvatarUrl = null;
                pickerSelectBtn.disabled = true;
            }
        });

        // ============================================================
        //  PICKER SELECT (unchanged)
        // ============================================================
        pickerSelectBtn.addEventListener('click', async () => {
            if (!selectedAvatarUrl) return;
            pickerSelectBtn.disabled = true;
            pickerSelectBtn.textContent = 'Saving...';

            try {
                const res = await fetch('/api/profile', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ avatar_url: selectedAvatarUrl })
                });
                const data = await res.json();

                if (data.success) {
                    pickerOverlay.classList.remove('active');
                    // Update preview
                    const preview = document.getElementById('avatarPreview');
                    preview.innerHTML = `<img src="${selectedAvatarUrl}" alt="Avatar" />`;
                    // Update current user
                    currentUser.avatar_url = selectedAvatarUrl;
                    // Re‑render avatar actions (show Remove button)
                    const actions = document.querySelector('.avatar-actions');
                    if (!actions.querySelector('#avatarRemoveBtn')) {
                        const removeBtn = document.createElement('button');
                        removeBtn.className = 'btn btn-danger';
                        removeBtn.id = 'avatarRemoveBtn';
                        removeBtn.textContent = 'Remove';
                        removeBtn.addEventListener('click', handleAvatarRemove);
                        actions.appendChild(removeBtn);
                    }
                    // Show success
                    document.getElementById('successBox').textContent = '✅ Avatar updated successfully!';
                    document.getElementById('successBox').style.display = 'block';
                    setTimeout(() => {
                        document.getElementById('successBox').style.display = 'none';
                    }, 3000);
                } else {
                    alert(data.error || 'Failed to save avatar.');
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }

            pickerSelectBtn.disabled = false;
            pickerSelectBtn.textContent = 'Select';
            selectedAvatarUrl = null;
        });

        // ============================================================
        //  HANDLE SAVE (NEW: Added email and phone number)
        // ============================================================
        async function handleSave() {
            const saveBtn = document.getElementById('saveBtn');
            const errorBox = document.getElementById('errorBox');
            const successBox = document.getElementById('successBox');

            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';
            errorBox.textContent = '';
            successBox.style.display = 'none';

            const displayName = document.getElementById('displayName').value.trim();
            const bio = document.getElementById('bio').value.trim();
            const username = document.getElementById('username').value.trim();
            // NEW: Get email and phone number values
            const email = document.getElementById('email').value.trim();
            const phoneNumber = document.getElementById('phoneNumber').value.trim();

            try {
                if (username !== currentUser.username) {
                    const res = await fetch('/api/profile?action=change-username', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ new_username: username })
                    });
                    const data = await res.json();
                    if (!data.success) {
                        errorBox.textContent = data.error || 'Failed to change username';
                        saveBtn.disabled = false;
                        saveBtn.textContent = 'Save Changes';
                        return;
                    }
                    localStorage.setItem('user_token', data.token);
                    currentUser.username = username;
                }

                // Send all fields including email and phone number
                const res = await fetch('/api/profile', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ 
                        display_name: displayName, 
                        bio,
                        email: email || null,
                        phone_number: phoneNumber || null
                    })
                });
                const data = await res.json();

                if (data.success) {
                    successBox.style.display = 'block';
                    errorBox.textContent = '';
                    currentUser.display_name = displayName;
                    currentUser.bio = bio;
                } else {
                    errorBox.textContent = data.error || 'Failed to update profile';
                }
            } catch (err) {
                errorBox.textContent = err.message;
            }

            saveBtn.disabled = false;
            saveBtn.textContent = 'Save Changes';
        }

        // ============================================================
        //  HANDLE AVATAR REMOVE (unchanged)
        // ============================================================
        async function handleAvatarRemove() {
            if (!confirm('Are you sure you want to remove your avatar?')) return;

            const errorBox = document.getElementById('errorBox');
            const successBox = document.getElementById('successBox');
            errorBox.textContent = '';
            successBox.style.display = 'none';

            try {
                const res = await fetch('/api/profile?action=avatar', {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                if (data.success) {
                    successBox.textContent = '✅ Avatar removed successfully!';
                    successBox.style.display = 'block';
                    // Remove avatar from preview
                    const preview = document.getElementById('avatarPreview');
                    preview.innerHTML = currentUser.username.charAt(0).toUpperCase();
                    currentUser.avatar_url = null;
                    // Remove the Remove button itself
                    const removeBtn = document.getElementById('avatarRemoveBtn');
                    if (removeBtn) removeBtn.remove();
                    setTimeout(() => {
                        successBox.style.display = 'none';
                    }, 3000);
                } else {
                    errorBox.textContent = data.error || 'Failed to remove avatar';
                }
            } catch (err) {
                errorBox.textContent = 'Error removing avatar: ' + err.message;
            }
        }

        // ============================================================
        //  INIT (unchanged)
        // ============================================================
        async function init() {
            await verifyUser();
            
            // Show skeleton first, then load
            renderSkeleton();
            loadProfile();
        }
        init();
    </script>
</body>
</html>
