<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Prompt Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        .auth-card h1 {
            text-align: center;
            margin-bottom: 8px;
            color: #111827;
            font-size: 28px;
        }
        .auth-card .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 24px;
            font-size: 14px;
        }
        .auth-card .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #4f46e5;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 4px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.2s;
            font-family: inherit;
        }
        .form-group input:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-primary:hover {
            background: #4338ca;
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-guest {
            width: 100%;
            padding: 12px;
            background: #f3f4f6;
            color: #374151;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-weight: 500;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 12px;
        }
        .btn-guest:hover {
            background: #e5e7eb;
        }
        .switch-mode {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: #6b7280;
        }
        .switch-mode a {
            color: #4f46e5;
            cursor: pointer;
            font-weight: 500;
            text-decoration: none;
        }
        .switch-mode a:hover {
            text-decoration: underline;
        }
        .error-msg {
            color: #dc2626;
            font-size: 14px;
            text-align: center;
            margin-top: 12px;
            display: none;
        }
        .success-msg {
            color: #10b981;
            font-size: 14px;
            text-align: center;
            margin-top: 12px;
            display: none;
        }
        .password-hint {
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
        }
        .hidden {
            display: none !important;
        }
        @media (max-width: 480px) {
            .auth-card { padding: 24px; }
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="brand">📚 Prompt Library</div>
        
        <h1 id="formTitle">Welcome Back</h1>
        <p class="subtitle" id="formSubtitle">Sign in to your account</p>

        <form id="authForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter username" required autocomplete="off" />
            </div>

            <div class="form-group hidden" id="displayNameGroup">
                <label for="displayName">Display Name</label>
                <input type="text" id="displayName" placeholder="Enter display name" autocomplete="off" />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" required />
                <div class="password-hint" id="passwordHint">Min 6 chars, 1 uppercase, 1 lowercase, 1 number</div>
            </div>

            <div class="form-group hidden" id="confirmPasswordGroup">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm password" />
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">Sign In</button>
            
            <button type="button" class="btn-guest" id="guestBtn">🚀 Explore as Guest</button>

            <div class="switch-mode">
                <span id="switchText">Don't have an account?</span>
                <a id="switchLink">Create one</a>
            </div>

            <div class="error-msg" id="errorMsg"></div>
            <div class="success-msg" id="successMsg"></div>
        </form>
    </div>

    <script>
        let isLoginMode = true;
        const form = document.getElementById('authForm');
        const username = document.getElementById('username');
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirmPassword');
        const displayName = document.getElementById('displayName');
        const displayNameGroup = document.getElementById('displayNameGroup');
        const confirmPasswordGroup = document.getElementById('confirmPasswordGroup');
        const submitBtn = document.getElementById('submitBtn');
        const guestBtn = document.getElementById('guestBtn');
        const formTitle = document.getElementById('formTitle');
        const formSubtitle = document.getElementById('formSubtitle');
        const switchLink = document.getElementById('switchLink');
        const switchText = document.getElementById('switchText');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const passwordHint = document.getElementById('passwordHint');

        // Toggle between Login and Register
        switchLink.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            
            if (isLoginMode) {
                formTitle.textContent = 'Welcome Back';
                formSubtitle.textContent = 'Sign in to your account';
                submitBtn.textContent = 'Sign In';
                switchText.textContent = "Don't have an account?";
                switchLink.textContent = 'Create one';
                displayNameGroup.classList.add('hidden');
                confirmPasswordGroup.classList.add('hidden');
                confirmPassword.required = false;
                displayName.required = false;
                passwordHint.textContent = 'Min 6 chars, 1 uppercase, 1 lowercase, 1 number';
            } else {
                formTitle.textContent = 'Create Account';
                formSubtitle.textContent = 'Join the Prompt Library community';
                submitBtn.textContent = 'Create Account';
                switchText.textContent = 'Already have an account?';
                switchLink.textContent = 'Sign in';
                displayNameGroup.classList.remove('hidden');
                confirmPasswordGroup.classList.remove('hidden');
                confirmPassword.required = true;
                displayName.required = false;
                passwordHint.textContent = 'Min 6 chars, 1 uppercase, 1 lowercase, 1 number';
            }
            
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
        });

        // Guest mode
        guestBtn.addEventListener('click', () => {
            document.cookie = 'guest_mode=true; Path=/; Max-Age=86400';
            window.location.href = '/explore.html';
        });

        // Form submit
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = isLoginMode ? 'Signing in...' : 'Creating account...';

            const usernameVal = username.value.trim();
            const passwordVal = password.value;
            const displayNameVal = displayName.value.trim() || usernameVal;

            // Validate password
            const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{6,}$/;
            if (!passwordRegex.test(passwordVal)) {
                errorMsg.textContent = 'Password must be at least 6 characters with 1 uppercase, 1 lowercase, and 1 number';
                errorMsg.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = isLoginMode ? 'Sign In' : 'Create Account';
                return;
            }

            if (!isLoginMode && passwordVal !== confirmPassword.value) {
                errorMsg.textContent = 'Passwords do not match';
                errorMsg.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';
                return;
            }

            // Validate username
            const usernameRegex = /^[a-zA-Z0-9_]{3,20}$/;
            if (!usernameRegex.test(usernameVal)) {
                errorMsg.textContent = 'Username must be 3-20 characters and contain only letters, numbers, or underscore';
                errorMsg.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = isLoginMode ? 'Sign In' : 'Create Account';
                return;
            }

            const endpoint = isLoginMode ? '/api/auth/login' : '/api/auth/register';
            const body = isLoginMode 
                ? { username: usernameVal, password: passwordVal }
                : { username: usernameVal, password: passwordVal, display_name: displayNameVal };

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                const data = await res.json();

                if (res.ok) {
                    successMsg.textContent = isLoginMode ? 'Welcome back! Redirecting...' : 'Account created! Redirecting...';
                    successMsg.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                } else {
                    errorMsg.textContent = data.error || 'Something went wrong';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = 'Network error. Please try again.';
                errorMsg.style.display = 'block';
            }

            submitBtn.disabled = false;
            submitBtn.textContent = isLoginMode ? 'Sign In' : 'Create Account';
        });

        // Check if already logged in
        async function checkAuth() {
            try {
                const res = await fetch('/api/auth/me');
                if (res.ok) {
                    window.location.href = '/';
                }
            } catch {}
        }
        checkAuth();
    </script>
</body>
</html>
