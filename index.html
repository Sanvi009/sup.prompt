<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="icon" type="image/png" href="/asset/icon.png" />
    <link rel="shortcut icon" href="/asset/icon.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spairogram</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single&display=swap');
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        /* ===== RESET & BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #e8ecf1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            padding: 10px;
        }

        /* ===== SKEOUOMORPHIC CARD ===== */
        .card {
            background: #e8ecf1;
            border-radius: 32px;
            padding: 48px 40px 44px;
            box-shadow: 
                12px 12px 24px rgba(0,0,0,0.08),
                -12px -12px 24px rgba(255,255,255,0.7);
            position: relative;
            transition: all 0.2s;
            text-align: center;
        }

        /* ===== BRANDING ===== */
        .brand-logo {
            width: 52px;
            height: 52px;
            object-fit: contain;
            display: block;
            margin: 0 auto 6px;
        }
        .card .brand-name {
            font-family: 'Bitcount Prop Single', serif;
            font-size: 30px;
            font-weight: 400;
            color: #1e293b;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .card .brand-name span { color: #4f46e5; }

        .card .sub {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 28px;
            font-weight: 500;
        }

        /* ===== PROFILE ICON (top-right) ===== */
        .profile-icon {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #e8ecf1;
            box-shadow: 
                4px 4px 8px rgba(0,0,0,0.06),
                -4px -4px 8px rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.15s;
            color: #4f46e5;
            border: none;
        }
        .profile-icon:hover {
            transform: scale(1.04);
            box-shadow: 
                4px 4px 10px rgba(0,0,0,0.08),
                -4px -4px 10px rgba(255,255,255,0.9);
        }

        /* ===== AUTH BOX ===== */
        .auth-box {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 360px;
            margin: 0 auto;
        }

        .auth-box .mode-label {
            font-weight: 600;
            font-size: 18px;
            color: #1e293b;
            margin-bottom: 4px;
        }

        /* ===== INPUTS (skeuomorphic) ===== */
        .input-group {
            position: relative;
            width: 100%;
        }
        .input-group input {
            width: 100%;
            padding: 14px 18px;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-family: inherit;
            background: #e8ecf1;
            box-shadow: 
                inset 4px 4px 8px rgba(0,0,0,0.06),
                inset -4px -4px 8px rgba(255,255,255,0.7);
            transition: all 0.15s;
            color: #1e293b;
            outline: none;
        }
        .input-group input:focus {
            box-shadow: 
                inset 6px 6px 10px rgba(0,0,0,0.08),
                inset -6px -6px 10px rgba(255,255,255,0.9),
                0 0 0 2px #4f46e5;
        }
        .input-group input::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }

        /* ===== BUTTONS (skeuomorphic) ===== */
        .btn-primary {
            padding: 14px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 
                4px 4px 10px rgba(79,70,229,0.25),
                -2px -2px 6px rgba(255,255,255,0.3);
            letter-spacing: 0.3px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 
                6px 6px 14px rgba(79,70,229,0.3),
                -2px -2px 8px rgba(255,255,255,0.4);
        }
        .btn-primary:active {
            transform: translateY(0px);
            box-shadow: 
                2px 2px 6px rgba(79,70,229,0.2),
                -2px -2px 4px rgba(255,255,255,0.2);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            padding: 14px;
            background: #e8ecf1;
            color: #1e293b;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 
                4px 4px 10px rgba(0,0,0,0.06),
                -4px -4px 10px rgba(255,255,255,0.7);
        }
        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 
                6px 6px 14px rgba(0,0,0,0.08),
                -6px -6px 14px rgba(255,255,255,0.8);
        }
        .btn-secondary:active {
            transform: translateY(0px);
        }

        .btn-guest {
            padding: 14px;
            background: transparent;
            color: #4f46e5;
            border: 1.5px solid #4f46e5;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-guest:hover {
            background: #4f46e5;
            color: white;
            box-shadow: 4px 4px 12px rgba(79,70,229,0.2);
        }
        .btn-guest:active {
            transform: scale(0.98);
        }

        /* ===== DIVIDER ===== */
        .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 500;
            margin: 4px 0;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1.5px;
            background: #d1d5db;
            border-radius: 2px;
        }

        /* ===== MODE TOGGLE ===== */
        .mode-toggle {
            display: flex;
            justify-content: center;
            gap: 6px;
            font-size: 14px;
            color: #64748b;
            font-weight: 500;
        }
        .mode-toggle button {
            background: none;
            border: none;
            color: #4f46e5;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            transition: color 0.2s;
        }
        .mode-toggle button:hover {
            color: #4338ca;
            text-decoration: underline;
        }

        /* ===== MESSAGES ===== */
        .msg-box {
            min-height: 24px;
            font-size: 14px;
            font-weight: 500;
            padding: 4px 0;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .msg-box.error {
            color: #dc2626;
        }
        .msg-box.success {
            color: #16a34a;
        }
        .msg-box.info {
            color: #4f46e5;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .card { padding: 32px 24px 28px; border-radius: 24px; }
            .brand-logo { width: 40px; height: 40px; }
            .card .brand-name { font-size: 26px; }
            .profile-icon { top: 16px; right: 16px; width: 38px; height: 38px; font-size: 17px; }
            .btn-primary, .btn-secondary, .btn-guest { font-size: 15px; padding: 12px; }
            .input-group input { font-size: 14px; padding: 12px 16px; }
            .auth-box .mode-label { font-size: 16px; }
        }

        @media (max-width: 420px) {
            .card { padding: 24px 16px 20px; }
            .brand-logo { width: 36px; height: 36px; }
            .card .brand-name { font-size: 22px; }
            .auth-box { gap: 12px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card" id="mainCard">
            <!-- Brand Logo & Name -->
            <img src="/asset/icon.png" class="brand-logo" alt="Icon" onerror="this.style.display='none'" />
            <h1 class="brand-name"><span>spairogram</span></h1>
            <p class="sub">Creating an account takes less than 10 seconds.</p>

            <!-- Profile Icon (visible only when logged in) -->
            <button class="profile-icon" id="profileIcon" style="display:none;" title="Profile">
                👤
            </button>

            <!-- Auth Box -->
            <div class="auth-box" id="authBox">
                <div class="mode-label" id="modeLabel">Welcome</div>

                <div class="msg-box" id="msgBox"></div>

                <div class="input-group">
                    <input type="text" id="usernameInput" placeholder="Username" autocomplete="off" />
                </div>
                <div class="input-group">
                    <input type="password" id="passwordInput" placeholder="Password" />
                </div>

                <button class="btn-primary" id="actionBtn">Log In</button>

                <div class="mode-toggle">
                    <span id="modeText">Don't have an account?</span>
                    <button id="toggleModeBtn">Create Account</button>
                </div>

                <div class="divider">or</div>

                <button class="btn-guest" id="guestBtn">👀 Explore as Guest</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  STATE
        // ============================================================
        let isLoginMode = true;
        const token = localStorage.getItem('user_token');

        // ============================================================
        //  DOM
        // ============================================================
        const usernameInput = document.getElementById('usernameInput');
        const passwordInput = document.getElementById('passwordInput');
        const actionBtn = document.getElementById('actionBtn');
        const toggleModeBtn = document.getElementById('toggleModeBtn');
        const modeText = document.getElementById('modeText');
        const modeLabel = document.getElementById('modeLabel');
        const msgBox = document.getElementById('msgBox');
        const guestBtn = document.getElementById('guestBtn');
        const profileIcon = document.getElementById('profileIcon');

        // ============================================================
        //  AUTO-REDIRECT IF ALREADY LOGGED IN
        // ============================================================
        if (token) {
            fetch('/api/auth?action=verify', {
                headers: { 'Authorization': `Bearer ${token}` }
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    window.location.href = '/feed/';
                } else {
                    localStorage.removeItem('user_token');
                }
            })
            .catch(() => {
                localStorage.removeItem('user_token');
            });
        }

        // ============================================================
        //  TOGGLE LOGIN / REGISTER
        // ============================================================
        toggleModeBtn.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            msgBox.textContent = '';
            msgBox.className = 'msg-box';

            if (isLoginMode) {
                modeLabel.textContent = 'Welcome';
                modeText.textContent = "Don't have an account?";
                toggleModeBtn.textContent = 'Create Account';
                actionBtn.textContent = 'Log In';
            } else {
                modeLabel.textContent = 'Create Account';
                modeText.textContent = 'Already have an account?';
                toggleModeBtn.textContent = 'Log In';
                actionBtn.textContent = 'Sign Up';
            }
        });

        // ============================================================
        //  SET MESSAGE HELPER
        // ============================================================
        function setMessage(text, type = 'error') {
            msgBox.textContent = text;
            msgBox.className = 'msg-box ' + type;
        }

        // ============================================================
        //  LOGIN / REGISTER
        // ============================================================
        actionBtn.addEventListener('click', async () => {
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            setMessage('', 'info');

            if (!username || !password) {
                setMessage('Please enter both username and password.', 'error');
                return;
            }

            actionBtn.disabled = true;
            actionBtn.textContent = isLoginMode ? 'Logging in...' : 'Creating account...';
            setMessage('', 'info');

            const action = isLoginMode ? 'login' : 'register';

            try {
                const res = await fetch(`/api/auth?action=${action}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (data.success) {
                    // Check if banned
                    if (data.user.is_banned) {
                        setMessage(
                            'Sorry, this account has been banned. ' + (data.user.ban_note || ''),
                            'error'
                        );
                        actionBtn.disabled = false;
                        actionBtn.textContent = isLoginMode ? 'Log In' : 'Sign Up';
                        return;
                    }

                    // Store token
                    localStorage.setItem('user_token', data.token);

                    // Success message
                    const successText = isLoginMode
                        ? 'Welcome back! Redirecting...'
                        : 'Account created! Redirecting...';
                    setMessage(successText, 'success');

                    // Redirect after short delay
                    setTimeout(() => {
                        window.location.href = '/feed/';
                    }, 1000);
                } else {
                    // Professional error messages
                    let errorMsg = 'Something went wrong. Please try again.';
                    if (data.error) {
                        if (data.error.includes('credentials')) {
                            errorMsg = 'Wrong username or password. Please try again.';
                        } else if (data.error.includes('taken')) {
                            errorMsg = 'This username is already taken. Please choose another.';
                        } else if (data.error.includes('banned')) {
                            errorMsg = 'Sorry, this account has been banned.';
                        } else {
                            errorMsg = data.error;
                        }
                    }
                    setMessage(errorMsg, 'error');
                }
            } catch (err) {
                setMessage('Unable to connect. Please check your internet and try again.', 'error');
            }

            actionBtn.disabled = false;
            actionBtn.textContent = isLoginMode ? 'Log In' : 'Sign Up';
        });

        // ============================================================
        //  ENTER KEY SUPPORT
        // ============================================================
        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') actionBtn.click();
        });
        usernameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') actionBtn.click();
        });

        // ============================================================
        //  GUEST ENTRY
        // ============================================================
        guestBtn.addEventListener('click', () => {
            window.location.href = '/feed/';
        });

        // ============================================================
        //  PROFILE ICON (if already logged in)
        // ============================================================
        if (token) {
            profileIcon.style.display = 'flex';
            profileIcon.addEventListener('click', () => {
                window.location.href = '/@me/';
            });
        }
    </script>
</body>
</html>
