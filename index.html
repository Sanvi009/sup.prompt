<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prompt Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            -webkit-font-smoothing: antialiased;
        }
        header {
            background: white;
            border-bottom: 1px solid #e2e8f0;
            padding: 20px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }
        header .brand { font-size: 22px; font-weight: 700; color: #0f172a; letter-spacing: -0.025em; }
        header .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            max-width: 600px;
            justify-content: flex-end;
        }
        header .controls input {
            padding: 10px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            background: #f8fafc;
            transition: all 0.2s;
            width: 100%;
            max-width: 320px;
        }
        header .controls input:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.08);
            background: white;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }
        .grid {
            column-count: 4;
            column-gap: 20px;
        }
        @media (max-width: 1024px) { .grid { column-count: 3; } }
        @media (max-width: 768px) { .grid { column-count: 2; } }
        @media (max-width: 480px) { .grid { column-count: 1; } }
        .card {
            break-inside: avoid;
            margin-bottom: 20px;
            background: white;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.06);
        }
        .card img {
            width: 100%;
            display: block;
            aspect-ratio: auto;
            background: #f1f5f9;
        }
        .card .info {
            padding: 14px 16px 16px;
        }
        .card .info .title {
            font-weight: 600;
            font-size: 15px;
            color: #0f172a;
            line-height: 1.3;
        }
        .loader {
            text-align: center;
            padding: 32px 0 48px;
            color: #64748b;
            font-size: 14px;
        }
        .loader .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #e2e8f0;
            border-top-color: #4f46e5;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty {
            text-align: center;
            padding: 60px 24px;
            color: #64748b;
        }
        .empty .icon { font-size: 48px; margin-bottom: 12px; }
        @media (max-width: 600px) {
            header { flex-direction: column; align-items: stretch; }
            header .controls { max-width: 100%; justify-content: stretch; }
            header .controls input { max-width: 100%; }
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">📚 Prompt Library</div>
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search prompts..." />
        </div>
    </header>
    <div class="container">
        <div class="grid" id="grid"></div>
        <div class="loader" id="loader">
            <span class="spinner"></span> Loading more...
        </div>
    </div>
    <script>
        let sb = null;
        async function initSupabase() {
            const res = await fetch('/api/supabase-config');
            const data = await res.json();
            sb = supabase.createClient(data.url, data.anonKey);
            initApp();
        }
        const STATE = {
            page: 0,
            pageSize: 12,
            loading: false,
            hasMore: true,
            search: ''
        };
        const grid = document.getElementById('grid');
        const loader = document.getElementById('loader');
        const searchInput = document.getElementById('searchInput');

        async function loadPrompts() {
            if (STATE.loading || !STATE.hasMore) return;
            STATE.loading = true;
            loader.style.display = 'block';

            const { data, error } = await sb
                .from('prompts')
                .select('*')
                .order('created_at', { ascending: false })
                .range(STATE.page * STATE.pageSize, (STATE.page + 1) * STATE.pageSize - 1);

            STATE.loading = false;
            loader.style.display = 'none';

            if (error) {
                console.error('🔥 Error:', error);
                grid.innerHTML = `<div class="empty"><div class="icon">⚠️</div>Error: ${error.message}</div>`;
                return;
            }

            if (data.length === 0) {
                STATE.hasMore = false;
                if (STATE.page === 0) {
                    grid.innerHTML = `<div class="empty"><div class="icon">📭</div>No prompts found.</div>`;
                }
                return;
            }

            let results = data;
            if (STATE.search.trim()) {
                const q = STATE.search.toLowerCase();
                results = data.filter(p =>
                    p.title.toLowerCase().includes(q) ||
                    (p.description || '').toLowerCase().includes(q) ||
                    p.prompt_text.toLowerCase().includes(q)
                );
            }

            if (results.length === 0 && STATE.page === 0) {
                grid.innerHTML = `<div class="empty"><div class="icon">🔍</div>No results found.</div>`;
                STATE.hasMore = false;
                return;
            }

            results.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => window.location.href = `/prompt/${p.slug}`;
                card.innerHTML = `
                    <img src="${p.image_main}" 
                         loading="lazy" 
                         onerror="this.src='https://via.placeholder.com/400/94a3b8/ffffff?text=?'" 
                         alt="${p.title}" />
                    <div class="info">
                        <div class="title">${p.title}</div>
                    </div>
                `;
                grid.appendChild(card);
            });

            STATE.page++;
            STATE.hasMore = data.length === STATE.pageSize;
        }

        let searchTimeout;
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                STATE.search = searchInput.value;
                STATE.page = 0;
                STATE.hasMore = true;
                grid.innerHTML = '';
                loadPrompts();
            }, 300);
        });

        let scrollTimeout;
        window.addEventListener('scroll', () => {
            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                const scrollY = window.scrollY;
                const windowHeight = window.innerHeight;
                const docHeight = document.documentElement.scrollHeight;
                if (scrollY + windowHeight >= docHeight - 400) {
                    loadPrompts();
                }
            }, 100);
        });

        function initApp() {
            loadPrompts();
        }
        document.addEventListener('DOMContentLoaded', initSupabase);
    </script>
</body>
</html>
