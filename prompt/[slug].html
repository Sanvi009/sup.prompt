<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prompt Detail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ===== RESET & BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #f0f2f5;
            color: #1a1a1a;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 16px 12px 80px;
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 12px;
            color: #65676b;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            transition: color 0.2s;
        }
        .back:hover { color: #1877f2; }

        /* ===== POST CARD ===== */
        .post-card {
            background: white;
            border-radius: 12px;
            border: 1px solid #e4e6eb;
            box-shadow: 0 1px 2px rgba(0,0,0,0.08);
            margin-bottom: 16px;
            overflow: hidden;
        }

        /* ===== POST HEADER ===== */
        .post-header {
            padding: 14px 16px 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .post-header .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e4e6eb;
            object-fit: cover;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: #1877f2;
            font-size: 16px;
        }
        .post-header .avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }
        .post-header .user-info {
            display: flex;
            flex-direction: column;
        }
        .post-header .user-info .name {
            font-weight: 600;
            font-size: 14px;
            color: #050505;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .post-header .user-info .badge {
            background: #1877f2;
            color: white;
            font-size: 10px;
            font-weight: 600;
            padding: 1px 6px;
            border-radius: 10px;
            letter-spacing: 0.3px;
        }
        .post-header .user-info .meta {
            font-size: 12px;
            color: #65676b;
        }

        /* ===== POST TITLE ===== */
        .post-title {
            padding: 0 16px 8px;
            font-size: 20px;
            font-weight: 700;
            color: #050505;
            letter-spacing: -0.3px;
        }

        /* ===== POST IMAGE ===== */
        .post-image-wrap {
            width: 100%;
            background: #f0f2f5;
            position: relative;
        }
        .post-image-wrap img {
            width: 100%;
            height: auto;
            max-height: 480px;
            object-fit: cover;
            display: block;
        }
        .post-image-wrap .view-count {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
            backdrop-filter: blur(4px);
        }
        .post-image-wrap .view-count svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* ===== INTERACTION BAR ===== */
        .interaction-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            border-bottom: 1px solid #e4e6eb;
            flex-wrap: wrap;
            gap: 6px;
        }
        .interaction-bar .left {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }
        .interaction-bar button {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            color: #65676b;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            transition: all 0.2s;
            padding: 4px 6px;
            border-radius: 6px;
        }
        .interaction-bar button:hover {
            background: #f0f2f5;
        }
        .interaction-bar button.liked {
            color: #e74c3c;
        }
        .interaction-bar button.liked svg {
            fill: #e74c3c;
        }
        .interaction-bar button svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            transition: fill 0.2s;
        }
        .interaction-bar .count {
            font-size: 13px;
            color: #65676b;
        }

        /* ===== PROMPT TEXT ===== */
        .prompt-text-wrap {
            padding: 14px 16px 16px;
            border-bottom: 1px solid #e4e6eb;
        }
        .prompt-text-wrap .label {
            font-size: 11px;
            font-weight: 600;
            color: #65676b;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 4px;
        }
        .prompt-text-wrap .text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            line-height: 1.7;
            color: #1a1a1a;
            white-space: pre-wrap;
        }

        /* ===== COMMENTS SECTION ===== */
        .comments-section {
            padding: 12px 16px 16px;
            border-bottom: 1px solid #e4e6eb;
        }
        .comments-section .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .comments-section .header h3 {
            font-size: 15px;
            font-weight: 600;
            color: #050505;
        }
        .comments-section .header .count {
            font-size: 13px;
            color: #65676b;
        }

        .comment-input-wrap {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .comment-input-wrap .avatar-small {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #e4e6eb;
            flex-shrink: 0;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: #1877f2;
            font-size: 12px;
        }
        .comment-input-wrap input {
            flex: 1;
            padding: 8px 14px;
            border: 1px solid #e4e6eb;
            border-radius: 20px;
            font-size: 13px;
            font-family: inherit;
            background: #f0f2f5;
            transition: border 0.2s, background 0.2s;
        }
        .comment-input-wrap input:focus {
            outline: none;
            border-color: #1877f2;
            background: white;
        }
        .comment-input-wrap .btn-submit {
            padding: 6px 16px;
            background: #1877f2;
            color: white;
            border: none;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .comment-input-wrap .btn-submit:hover {
            background: #166fe5;
        }
        .comment-input-wrap .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== COMMENT ITEMS ===== */
        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .comment-item {
            display: flex;
            gap: 8px;
        }
        .comment-item .avatar-small {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #e4e6eb;
            flex-shrink: 0;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: #1877f2;
            font-size: 12px;
        }
        .comment-item .avatar-small img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }
        .comment-item .body {
            flex: 1;
        }
        .comment-item .body .row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .comment-item .body .row .name {
            font-weight: 600;
            font-size: 13px;
            color: #050505;
            cursor: pointer;
        }
        .comment-item .body .row .name:hover {
            text-decoration: underline;
        }
        .comment-item .body .row .time {
            font-size: 11px;
            color: #65676b;
        }
        .comment-item .body .content {
            font-size: 14px;
            color: #1a1a1a;
            line-height: 1.5;
            margin-top: 2px;
        }
        .comment-item .body .actions {
            display: flex;
            gap: 12px;
            margin-top: 4px;
            font-size: 12px;
            color: #65676b;
        }
        .comment-item .body .actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 12px;
            color: #65676b;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: color 0.2s;
            padding: 2px 4px;
        }
        .comment-item .body .actions button:hover {
            color: #1877f2;
        }
        .comment-item .body .actions button.liked {
            color: #e74c3c;
        }
        .comment-item .body .actions button.liked svg {
            fill: #e74c3c;
        }
        .comment-item .body .actions svg {
            width: 12px;
            height: 12px;
            fill: currentColor;
        }

        .comment-item .replies {
            margin-top: 6px;
            margin-left: 36px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .comment-item .reply-input-wrap {
            margin-top: 6px;
            margin-left: 36px;
            display: flex;
            gap: 6px;
        }
        .comment-item .reply-input-wrap input {
            flex: 1;
            padding: 6px 12px;
            border: 1px solid #e4e6eb;
            border-radius: 16px;
            font-size: 12px;
            font-family: inherit;
            background: #f0f2f5;
        }
        .comment-item .reply-input-wrap input:focus {
            outline: none;
            border-color: #1877f2;
        }
        .comment-item .reply-input-wrap button {
            padding: 6px 12px;
            background: #1877f2;
            color: white;
            border: none;
            border-radius: 16px;
            font-weight: 500;
            font-size: 12px;
            cursor: pointer;
        }

        .load-more-comments {
            margin-top: 10px;
            text-align: center;
        }
        .load-more-comments button {
            background: none;
            border: none;
            color: #1877f2;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
            padding: 6px 12px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .load-more-comments button:hover {
            background: #e7f3ff;
        }

        /* ===== COPY BUTTON (after comments) ===== */
        .copy-wrap {
            padding: 12px 16px 16px;
        }
        .copy-btn {
            width: 100%;
            padding: 10px;
            background: #1877f2;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .copy-btn:hover {
            background: #166fe5;
        }
        .copy-btn.copied {
            background: #10b981;
        }

        /* ===== RELATED PROMPTS ===== */
        .related-section {
            margin-top: 16px;
        }
        .related-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: #050505;
            margin-bottom: 10px;
        }
        .related-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .related-card {
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            background: white;
            border: 1px solid #e4e6eb;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            padding-bottom: 100%;
        }
        .related-card:hover {
            transform: scale(1.01);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .related-card img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .related-card .title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 10px 12px;
            background: linear-gradient(transparent, rgba(0,0,0,0.6));
            color: white;
            font-size: 13px;
            font-weight: 500;
        }

        /* ===== LOADING ===== */
        .loading {
            text-align: center;
            padding: 60px;
            color: #65676b;
        }
        .loading .spinner {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid #e4e6eb;
            border-top-color: #1877f2;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== POPUP ===== */
        .popup-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .popup-overlay.active { display: flex; }
        .popup {
            background: white;
            border-radius: 16px;
            padding: 32px 36px;
            max-width: 400px;
            width: 92%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .popup h2 { font-size: 20px; font-weight: 700; color: #050505; }
        .popup p { color: #65676b; font-size: 15px; margin: 8px 0 24px; }
        .popup .btn-primary {
            padding: 10px 28px;
            background: #1877f2;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .popup .btn-primary:hover { background: #166fe5; }
        .popup .btn-secondary {
            padding: 10px 28px;
            background: #e4e6eb;
            border: none;
            border-radius: 10px;
            font-weight: 500;
            font-size: 15px;
            cursor: pointer;
            margin-left: 10px;
            transition: background 0.2s;
        }
        .popup .btn-secondary:hover { background: #d8dadf; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            .container { padding: 12px 10px 60px; }
            .post-header { padding: 10px 12px; }
            .post-title { padding: 0 12px 6px; font-size: 18px; }
            .interaction-bar { padding: 8px 12px; gap: 4px; }
            .interaction-bar .left { gap: 8px; }
            .interaction-bar button { font-size: 12px; }
            .interaction-bar button svg { width: 16px; height: 16px; }
            .prompt-text-wrap { padding: 10px 12px 14px; }
            .prompt-text-wrap .text { font-size: 13px; }
            .comments-section { padding: 10px 12px 14px; }
            .copy-wrap { padding: 10px 12px 14px; }
            .related-grid { grid-template-columns: 1fr; }
            .post-image-wrap .view-count { font-size: 11px; padding: 4px 10px; }
            .post-image-wrap .view-count svg { width: 14px; height: 14px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/feed/" class="back">← Back to Feed</a>
        <div id="content" class="loading">
            <div class="spinner"></div>
            <p>Loading prompt...</p>
        </div>
    </div>

    <!-- POPUP -->
    <div class="popup-overlay" id="popup">
        <div class="popup">
            <h2>🔒 Sign in to interact</h2>
            <p>You need to log in or create an account to like, save, or comment.</p>
            <button class="btn-primary" id="popupLoginBtn">Log In / Sign Up</button>
            <button class="btn-secondary" id="popupCloseBtn">Cancel</button>
        </div>
    </div>

    <script>
        // ============================================================
        //  STATE
        // ============================================================
        const token = localStorage.getItem('user_token');
        let user = null;
        let promptId = null;
        let liked = false;
        let saved = false;
        let likeCount = 0;
        let saveCount = 0;
        let currentSlug = '';
        let commentOffset = 0;
        const commentLimit = 10;
        let hasMoreComments = true;
        let loadingComments = false;

        // ============================================================
        //  DOM
        // ============================================================
        const container = document.getElementById('content');
        const popup = document.getElementById('popup');

        // ============================================================
        //  VERIFY USER
        // ============================================================
        async function verifyUser() {
            if (!token) return null;
            try {
                const res = await fetch('/api/auth?action=verify', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.success) {
                    user = data.user;
                    return user;
                } else {
                    localStorage.removeItem('user_token');
                    return null;
                }
            } catch {
                localStorage.removeItem('user_token');
                return null;
            }
        }

        // ============================================================
        //  LOAD PROMPT
        // ============================================================
        async function loadPrompt() {
            const slug = window.location.pathname.split('/').pop();
            currentSlug = slug;

            try {
                const url = `/api/prompts?action=by-slug&slug=${slug}`;
                const res = await fetch(url);
                const data = await res.json();

                if (!data.prompt) {
                    container.innerHTML = `<div class="loading">❌ Prompt not found</div>`;
                    return;
                }

                const p = data.prompt;
                promptId = p.id;
                likeCount = p.like_count || 0;
                saveCount = p.save_count || 0;

                if (user) {
                    const statusRes = await fetch(`/api/interactions?action=status&promptId=${promptId}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const statusData = await statusRes.json();
                    liked = statusData.liked || false;
                    saved = statusData.saved || false;
                }

                renderPrompt(p);
                loadComments(true);
                loadRelated();

            } catch (err) {
                container.innerHTML = `<div class="loading">❌ Error loading prompt</div>`;
                console.error(err);
            }
        }

        // ============================================================
        //  RENDER PROMPT
        // ============================================================
        function renderPrompt(p) {
            const date = new Date(p.created_at).toLocaleDateString('en-US', {
                month: 'short', day: 'numeric', year: 'numeric'
            });

            const likeIcon = liked
                ? `<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`
                : `<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
            const saveIcon = saved
                ? `<svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>`
                : `<svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>`;
            const likeClass = liked ? 'liked' : '';
            const saveClass = saved ? 'saved' : '';
            const viewIcon = `<svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5 5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3 1.34 3 3-1.34-3-3-3z"/></svg>`;

            container.innerHTML = `
                <div class="post-card">
                    <!-- Header -->
                    <div class="post-header">
                        <div class="avatar">
                            <img src="/ceo/ceo.png" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" />
                            <span style="display:none;">${p.title.charAt(0).toUpperCase()}</span>
                        </div>
                        <div class="user-info">
                            <div class="name">
                                CEO &amp; Founder
                                <span class="badge">✓</span>
                            </div>
                            <div class="meta">${date} · ${p.view_count || 0} views</div>
                        </div>
                    </div>

                    <!-- Title -->
                    <div class="post-title">${p.title}</div>

                    <!-- Image + View Count -->
                    <div class="post-image-wrap">
                        <img src="${p.image_main}" 
                             onerror="this.src='https://images.unsplash.com/photo-1542831371-29b0f74f9713?w=800&h=450&fit=crop&auto=format'" 
                             alt="${p.title}" />
                        ${p.image_optional ? `<img src="${p.image_optional}" style="display:block;width:100%;max-height:400px;object-fit:cover;" />` : ''}
                        <div class="view-count">
                            ${viewIcon} ${p.view_count || 0}
                        </div>
                    </div>

                    <!-- Interaction Bar -->
                    <div class="interaction-bar">
                        <div class="left">
                            <button class="like-btn ${likeClass}" id="likeBtn">
                                ${likeIcon} <span class="count">${likeCount}</span>
                            </button>
                            <button class="save-btn ${saveClass}" id="saveBtn">
                                ${saveIcon} <span class="count">${saveCount}</span>
                            </button>
                            <button class="share-btn" id="shareBtn">
                                <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
                            </button>
                            <button class="report-btn" id="reportBtn">
                                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                            </button>
                        </div>
                    </div>

                    <!-- Prompt Text -->
                    <div class="prompt-text-wrap">
                        <div class="label">Prompt Text</div>
                        <div class="text" id="promptText">${p.prompt_text}</div>
                    </div>

                    <!-- Comments Section -->
                    <div class="comments-section" id="commentsSection">
                        <div class="header">
                            <h3>Comments</h3>
                            <span class="count" id="commentCount">0</span>
                        </div>
                        <div class="comment-input-wrap">
                            <div class="avatar-small">${user ? user.username.charAt(0).toUpperCase() : '?'}</div>
                            <input type="text" id="commentInput" placeholder="Write a comment..." />
                            <button class="btn-submit comment-submit">Post</button>
                        </div>
                        <div class="comments-list" id="commentsList"></div>
                        <div class="load-more-comments" id="loadMoreWrap" style="display:none;">
                            <button id="loadMoreBtn">Load more comments</button>
                        </div>
                    </div>

                    <!-- Copy Button (after comments) -->
                    <div class="copy-wrap">
                        <button class="copy-btn" id="copyBtn">📋 Copy Prompt</button>
                    </div>
                </div>

                <!-- Related Prompts -->
                <div class="related-section" id="relatedSection">
                    <h3>More from CEO &amp; Founder</h3>
                    <div class="related-grid"></div>
                </div>
            `;

            // --- Interactions ---
            document.getElementById('copyBtn').addEventListener('click', () => {
                const text = document.getElementById('promptText').textContent;
                navigator.clipboard.writeText(text).then(() => {
                    const btn = document.getElementById('copyBtn');
                    btn.textContent = '✅ Copied!';
                    btn.classList.add('copied');
                    setTimeout(() => {
                        btn.textContent = '📋 Copy Prompt';
                        btn.classList.remove('copied');
                    }, 2000);
                });
            });

            document.getElementById('likeBtn').addEventListener('click', () => handleLike());
            document.getElementById('saveBtn').addEventListener('click', () => handleSave());
            document.getElementById('shareBtn').addEventListener('click', () => handleShare());
            document.getElementById('reportBtn').addEventListener('click', () => handleReport());

            // Comment load more
            document.getElementById('loadMoreBtn').addEventListener('click', () => {
                loadComments(false);
            });
        }

        // ============================================================
        //  INTERACTIONS
        // ============================================================
        async function handleLike() {
            if (!user) { popup.classList.add('active'); return; }
            const action = liked ? 'unlike' : 'like';
            const method = liked ? 'DELETE' : 'POST';
            try {
                const res = await fetch(`/api/interactions?action=${action}`, {
                    method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ promptId })
                });
                const data = await res.json();
                if (data.success) {
                    liked = !liked;
                    likeCount = data.like_count;
                    updateInteractions();
                }
            } catch (err) { console.error(err); }
        }

        async function handleSave() {
            if (!user) { popup.classList.add('active'); return; }
            const action = saved ? 'unsave' : 'save';
            const method = saved ? 'DELETE' : 'POST';
            try {
                const res = await fetch(`/api/interactions?action=${action}`, {
                    method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ promptId })
                });
                const data = await res.json();
                if (data.success) {
                    saved = !saved;
                    saveCount = data.save_count;
                    updateInteractions();
                }
            } catch (err) { console.error(err); }
        }

        function handleShare() {
            navigator.clipboard.writeText(window.location.href);
            alert('Link copied to clipboard!');
        }

        function handleReport() {
            if (!user) { popup.classList.add('active'); return; }
            const reason = prompt('Why are you reporting this prompt?');
            if (reason && reason.trim()) {
                fetch('/api/reports?action=submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ targetPromptId: promptId, reason: reason.trim() })
                }).then(() => alert('Report submitted. Thank you!'));
            }
        }

        function updateInteractions() {
            const likeBtn = document.getElementById('likeBtn');
            const saveBtn = document.getElementById('saveBtn');
            likeBtn.innerHTML = `${liked ? '<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>' : '<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>'} <span class="count">${likeCount}</span>`;
            saveBtn.innerHTML = `${saved ? '<svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>' : '<svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>'} <span class="count">${saveCount}</span>`;
            likeBtn.className = `like-btn ${liked ? 'liked' : ''}`;
            saveBtn.className = `save-btn ${saved ? 'saved' : ''}`;
        }

        // ============================================================
        //  COMMENTS
        // ============================================================
        async function loadComments(reset = false) {
            if (loadingComments) return;
            if (!reset && !hasMoreComments) return;
            loadingComments = true;

            if (reset) {
                commentOffset = 0;
                hasMoreComments = true;
            }

            try {
                const url = `/api/comments?action=list&promptId=${promptId}&limit=${commentLimit}&offset=${commentOffset}`;
                const res = await fetch(url, {
                    headers: user ? { 'Authorization': `Bearer ${token}` } : {}
                });
                const data = await res.json();

                if (reset) {
                    document.getElementById('commentsList').innerHTML = '';
                }

                renderComments(data.comments || [], reset);
                commentOffset += data.comments.length;
                hasMoreComments = data.hasMore;

                document.getElementById('loadMoreWrap').style.display = hasMoreComments ? 'block' : 'none';
                document.getElementById('commentCount').textContent = data.total || 0;

            } catch (err) {
                console.error(err);
            }
            loadingComments = false;
        }

        function renderComments(comments, reset) {
            const list = document.getElementById('commentsList');
            if (reset) list.innerHTML = '';
            if (comments.length === 0 && reset) {
                list.innerHTML = `<div style="text-align:center;color:#65676b;padding:12px 0;">No comments yet. Be the first!</div>`;
                return;
            }
            comments.forEach(c => {
                list.insertAdjacentHTML('beforeend', renderComment(c));
            });
        }

        function renderComment(c, isReply = false) {
            const avatar = c.profiles?.avatar_url || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(c.profiles?.username || '?') + '&background=e4e6eb&color=1877f2&size=28';
            const displayName = c.profiles?.display_name || c.profiles?.username || 'Anonymous';
            const username = c.profiles?.username || 'anonymous';
            const time = new Date(c.created_at).toLocaleDateString();
            const likeIcon = c.liked ? `<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>` : `<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
            const likeClass = c.liked ? 'liked' : '';

            let html = `
                <div class="comment-item">
                    <div class="avatar-small" style="background-image:url(${avatar});background-size:cover;background-position:center;">
                        ${!c.profiles?.avatar_url ? displayName.charAt(0).toUpperCase() : ''}
                    </div>
                    <div class="body">
                        <div class="row">
                            <span class="name" onclick="window.location.href='/@${username}'">${displayName}</span>
                            <span class="time">${time}</span>
                        </div>
                        <div class="content">${c.content}</div>
                        <div class="actions">
                            <button class="comment-like-btn ${likeClass}" data-id="${c.id}">
                                ${likeIcon} ${c.likes_count || 0}
                            </button>
                            <span style="color:#d1d5db;">·</span>
                            ${!isReply ? `<button class="reply-toggle" data-id="${c.id}">Reply</button>` : ''}
                        </div>
            `;

            if (!isReply && c.replies && c.replies.length > 0) {
                html += `<div class="replies">${c.replies.map(r => renderComment(r, true)).join('')}</div>`;
            }

            if (!isReply) {
                html += `
                    <div class="reply-input-wrap" id="replyForm_${c.id}" style="display:none;">
                        <input type="text" placeholder="Write a reply..." id="replyInput_${c.id}" />
                        <button class="reply-submit" data-id="${c.id}">Reply</button>
                    </div>
                `;
            }

            html += `</div></div>`;
            return html;
        }

        // ============================================================
        //  COMMENT EVENTS
        // ============================================================
        document.addEventListener('click', async (e) => {
            // Add top-level comment
            const submitBtn = e.target.closest('.comment-submit');
            if (submitBtn) {
                e.preventDefault();
                if (!user) { popup.classList.add('active'); return; }
                const input = document.getElementById('commentInput');
                const content = input.value.trim();
                if (!content) return;
                submitBtn.disabled = true;
                try {
                    const res = await fetch('/api/comments?action=add', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ promptId, content })
                    });
                    if (res.ok) {
                        input.value = '';
                        loadComments(true);
                    }
                } catch (err) { console.error(err); }
                submitBtn.disabled = false;
            }

            // Toggle reply form
            const replyToggle = e.target.closest('.reply-toggle');
            if (replyToggle) {
                const id = replyToggle.dataset.id;
                const form = document.getElementById(`replyForm_${id}`);
                if (form) form.style.display = form.style.display === 'none' ? 'flex' : 'none';
            }

            // Submit reply
            const replySubmit = e.target.closest('.reply-submit');
            if (replySubmit) {
                if (!user) { popup.classList.add('active'); return; }
                const id = replySubmit.dataset.id;
                const input = document.getElementById(`replyInput_${id}`);
                const content = input.value.trim();
                if (!content) return;
                try {
                    const res = await fetch('/api/comments?action=add', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ promptId, content, parentId: id })
                    });
                    if (res.ok) {
                        input.value = '';
                        loadComments(true);
                    }
                } catch (err) { console.error(err); }
            }

            // Like comment
            const likeBtn = e.target.closest('.comment-like-btn');
            if (likeBtn) {
                if (!user) { popup.classList.add('active'); return; }
                const commentId = likeBtn.dataset.id;
                const liked = likeBtn.classList.contains('liked');
                const action = liked ? 'unlike-comment' : 'like-comment';
                const method = liked ? 'DELETE' : 'POST';
                try {
                    const res = await fetch(`/api/comments?action=${action}`, {
                        method,
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ commentId })
                    });
                    if (res.ok) {
                        loadComments(true);
                    }
                } catch (err) { console.error(err); }
            }
        });

        // ============================================================
        //  RELATED PROMPTS
        // ============================================================
        async function loadRelated() {
            try {
                const res = await fetch(`/api/prompts?action=related&promptId=${promptId}&limit=6`);
                const data = await res.json();
                const prompts = data.prompts || [];
                const grid = document.querySelector('.related-grid');
                if (!grid) return;
                if (prompts.length === 0) {
                    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:#65676b;padding:16px 0;">No related prompts found.</div>`;
                    return;
                }
                grid.innerHTML = prompts.map(p => `
                    <div class="related-card" onclick="window.location.href='/prompt/${p.slug}'">
                        <img src="${p.image_main}" 
                             onerror="this.src='https://images.unsplash.com/photo-1542831371-29b0f74f9713?w=400&h=400&fit=crop&auto=format'" 
                             alt="${p.title}" />
                        <div class="title">${p.title}</div>
                    </div>
                `).join('');
            } catch (err) { console.error(err); }
        }

        // ============================================================
        //  POPUP
        // ============================================================
        document.getElementById('popupLoginBtn').addEventListener('click', () => {
            window.location.href = '/';
        });
        document.getElementById('popupCloseBtn').addEventListener('click', () => {
            popup.classList.remove('active');
        });
        popup.addEventListener('click', (e) => {
            if (e.target === e.currentTarget) popup.classList.remove('active');
        });

        // ============================================================
        //  INIT
        // ============================================================
        async function init() {
            await verifyUser();
            loadPrompt();
        }
        init();
    </script>
</body>
</html>
