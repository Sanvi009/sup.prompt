<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prompt Detail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 24px;
        }
        .back {
            display: inline-block;
            margin-bottom: 24px;
            color: #4f46e5;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
        }
        .back:hover { text-decoration: underline; }
        .prompt-card {
            background: white;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            padding: 32px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .prompt-card img {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 24px;
            background: #f1f5f9;
        }
        .prompt-card h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .prompt-card .meta {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 16px;
        }
        .prompt-card .description {
            font-size: 16px;
            color: #334155;
            margin-bottom: 16px;
            line-height: 1.6;
        }
        .prompt-card .prompt-text {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 15px;
            white-space: pre-wrap;
            line-height: 1.6;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }
        .prompt-card .copy-btn {
            padding: 10px 24px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .prompt-card .copy-btn:hover { background: #4338ca; }
        .prompt-card .copy-btn.copied { background: #10b981; }

        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back">← Back to Library</a>
        <div id="content" class="loading">Loading prompt...</div>
    </div>

    <script>
        let sb = null;
        async function initSupabase() {
            const res = await fetch('/api/supabase-config');
            const data = await res.json();
            sb = supabase.createClient(data.url, data.anonKey);
            loadPrompt();
        }

        async function loadPrompt() {
            const slug = window.location.pathname.split('/').pop();
            const container = document.getElementById('content');

            const { data: prompt, error } = await sb
                .from('prompts')
                .select('*')
                .eq('slug', slug)
                .single();

            if (error || !prompt) {
                container.innerHTML = `<div class="loading">❌ Prompt not found</div>`;
                return;
            }

            container.innerHTML = `
                <div class="prompt-card">
                    <img src="${prompt.image_main}" 
                         onerror="this.src='https://via.placeholder.com/800/94a3b8/ffffff?text=?'" 
                         alt="${prompt.title}" />
                    <h1>${prompt.title}</h1>
                    <div class="meta">${new Date(prompt.created_at).toLocaleDateString()}</div>
                    ${prompt.description ? `<div class="description">${prompt.description}</div>` : ''}
                    <div class="prompt-text" id="promptText">${prompt.prompt_text}</div>
                    <button class="copy-btn" id="copyBtn">📋 Copy Prompt</button>
                </div>
            `;

            document.getElementById('copyBtn').addEventListener('click', () => {
                const text = document.getElementById('promptText').textContent;
                navigator.clipboard.writeText(text).then(() => {
                    const btn = document.getElementById('copyBtn');
                    btn.textContent = '✅ Copied!';
                    btn.classList.add('copied');
                    setTimeout(() => {
                        btn.textContent = '📋 Copy Prompt';
                        btn.classList.remove('copied');
                    }, 2000);
                });
            });
        }

        document.addEventListener('DOMContentLoaded', initSupabase);
    </script>
</body>
</html>
