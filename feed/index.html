    <script>
        // ============================================================
        //  STATE
        // ============================================================
        const token = localStorage.getItem('user_token');
        let user = null;
        let page = 0;
        let loading = false;
        let hasMore = true;
        let searchTimeout = null;
        let currentPromptIdForComments = null;
        let replyToCommentId = null;
        let replyToUsername = null;

        // Local state trackers for debounced optimistic updates
        let localLikes = {};      // { promptId: { count, liked } }
        let localSaves = {};     // { promptId: { count, saved } }
        let likeDebounceTimers = {};
        let saveDebounceTimers = {};

        // Follow debounce state
        let followDebounceTimers = {};

        // Creative section tracking
        let creativeSectionCount = 0;
        let lastCreativeIndex = -1;

        // ============================================================
        //  DOM
        // ============================================================
        const feedContainer = document.getElementById('feedContainer');
        const loader = document.getElementById('loader');
        const searchInput = document.getElementById('searchInput');
        const profileBtn = document.getElementById('profileBtn');
        const popup = document.getElementById('popup');
        const commentModal = document.getElementById('commentModal');
        const commentList = document.getElementById('commentList');
        const commentInput = document.getElementById('commentInput');
        const commentSubmitBtn = document.getElementById('commentSubmitBtn');
        const commentUserAvatar = document.getElementById('commentUserAvatar');
        const imageModal = document.getElementById('imageModal');
        const imageModalContent = document.getElementById('imageModalContent');

        // ============================================================
        //  HELPERS
        // ============================================================
        function getOptimizedImageUrl(url) {
            if (!url) return '';
            const screenWidth = window.innerWidth;
            let width = 800;
            if (screenWidth < 640) width = 400;
            else if (screenWidth < 1024) width = 600;
            return `${url}?width=${width}&format=webp`;
        }

        function formatViewCount(count) {
            if (count < 1000) return count.toString();
            const thousands = count / 1000;
            if (thousands < 10) {
                return thousands.toFixed(1) + 'k';
            }
            return Math.round(thousands) + 'k';
        }

        // ============================================================
        //  VERIFY USER
        // ============================================================
        async function verifyUser() {
            if (!token) return null;
            try {
                const res = await fetch('/api/auth?action=verify', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.success) {
                    user = data.user;
                    
                    if (user.avatar_url) {
                        profileBtn.innerHTML = `<img src="${user.avatar_url}" />`;
                    } else {
                        profileBtn.textContent = user.username.charAt(0).toUpperCase();
                    }

                    if (user.avatar_url) {
                        commentUserAvatar.innerHTML = `<img src="${user.avatar_url}" alt="Avatar" />`;
                    } else {
                        commentUserAvatar.textContent = user.username.charAt(0).toUpperCase();
                        commentUserAvatar.style.backgroundImage = 'none';
                    }

                    return user;
                } else {
                    localStorage.removeItem('user_token');
                    return null;
                }
            } catch {
                localStorage.removeItem('user_token');
                return null;
            }
        }

        // ============================================================
        //  RENDER SKELETON (Feed) - NOW ONLY 2 SKELETONS
        // ============================================================
        function renderSkeletons(count = 2) {
            let html = '';
            for (let i = 0; i < count; i++) {
                html += `
                    <div class="skeleton-post">
                        <div class="header">
                            <div class="skeleton avatar"></div>
                            <div class="info">
                                <div class="skeleton line"></div>
                                <div class="skeleton line short"></div>
                            </div>
                        </div>
                        <div class="body">
                            <div class="skeleton line"></div>
                            <div class="skeleton line short"></div>
                        </div>
                        <div class="skeleton image"></div>
                        <div class="actions">
                            <div class="skeleton btn"></div>
                            <div class="skeleton btn"></div>
                            <div class="skeleton btn"></div>
                        </div>
                    </div>
                `;
            }
            feedContainer.innerHTML = html;
        }

        // ============================================================
        //  RENDER SKELETON (Comments)
        // ============================================================
        function renderCommentSkeletons(count = 3) {
            let html = '';
            for (let i = 0; i < count; i++) {
                html += `
                    <div class="skeleton-comment">
                        <div class="skeleton avatar"></div>
                        <div class="body">
                            <div class="skeleton line"></div>
                            <div class="skeleton line short"></div>
                            <div class="skeleton line long"></div>
                        </div>
                    </div>
                `;
            }
            commentList.innerHTML = html;
        }

        // ============================================================
        //  GET DYNAMIC LIMIT (2 → 4 → 6 → 6...)
        // ============================================================
        function getDynamicLimit() {
            if (page === 0) return 2;      // First load: 2 prompts
            if (page === 1) return 4;      // Second load: 4 prompts
            return 6;                      // All subsequent loads: 6 prompts
        }

        // ============================================================
        //  LOAD FEED
        // ============================================================
        async function loadFeed(reset = false) {
            if (loading || (!hasMore && !reset)) return;
            loading = true;
            if (reset) {
                page = 0;
                hasMore = true;
                localLikes = {};
                localSaves = {};
                creativeSectionCount = 0;
                lastCreativeIndex = -1;
                renderSkeletons(2); // Show only 2 skeletons initially
                loader.style.display = 'block';
            }

            const action = token ? 'feed' : 'explore';
            const currentLimit = getDynamicLimit();
            const url = `/api/feed?action=${action}&limit=${currentLimit}&offset=${page * 6}`;

            try {
                const res = await fetch(url, {
                    headers: token ? { 'Authorization': `Bearer ${token}` } : {}
                });
                const data = await res.json();
                const prompts = data.prompts || [];
                const suggestions = data.suggestions || [];

                if (reset) feedContainer.innerHTML = '';

                if (prompts.length === 0 && page === 0) {
                    feedContainer.innerHTML = `<div class="empty"><div class="icon">📭</div>No prompts found.</div>`;
                    loader.style.display = 'none';
                    loading = false;
                    return;
                }

                // Render prompts with creative section insertion
                for (let i = 0; i < prompts.length; i++) {
                    const p = prompts[i];
                    
                    localLikes[p.id] = { count: p.like_count || 0, liked: p.liked || false };
                    localSaves[p.id] = { count: p.save_count || 0, saved: p.saved || false };
                    
                    const globalIndex = (page * 6) + i;
                    const shouldInsert = shouldInsertCreativeSection(globalIndex);
                    
                    if (shouldInsert && suggestions.length > 0 && user) {
                        feedContainer.appendChild(createCreativeSection(suggestions, globalIndex));
                        creativeSectionCount++;
                    }
                    
                    feedContainer.appendChild(createPostElement(p));
                }

                hasMore = data.hasMore;
                page++;
                loader.style.display = hasMore ? 'block' : 'none';

            } catch (err) {
                console.error('Feed error:', err);
                if (page === 0) {
                    feedContainer.innerHTML = `<div class="empty"><div class="icon">⚠️</div>Error loading feed.</div>`;
                }
            }
            loading = false;
        }

        // ============================================================
        //  CREATIVE SECTION INSERTION LOGIC
        // ============================================================
        function shouldInsertCreativeSection(globalIndex) {
            if (!user) return false;
            if (creativeSectionCount === 0 && globalIndex === 9) return true;
            if (creativeSectionCount > 0 && globalIndex === 9 + (creativeSectionCount * 20)) return true;
            return false;
        }

        // ============================================================
        //  CREATE CREATIVE SECTION
        // ============================================================
        function createCreativeSection(suggestions, globalIndex) {
            const section = document.createElement('div');
            section.className = 'creative-section';
            section.dataset.index = globalIndex;

            let html = `
                <div class="header">
                    <h3>✨ Creative Peoples</h3>
                    <button class="dismiss" data-index="${globalIndex}">Dismiss</button>
                </div>
                <div class="creative-grid">
            `;

            suggestions.forEach(s => {
                const avatarUrl = s.avatar_url || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(s.username) + '&background=4f46e5&color=fff&size=40';
                const displayName = s.display_name || s.username;
                let badges = '';
                if (s.is_premium) badges += '⭐';
                if (s.is_owner) badges += '👑';

                html += `
                    <div class="creative-card" onclick="window.location.href='/@${s.username}'">
                        <div class="avatar">
                            <img src="${avatarUrl}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(s.username)}&background=4f46e5&color=fff&size=40'" />
                        </div>
                        <div class="info">
                            <div class="username">@${s.username}</div>
                            <div class="display-name">${displayName} ${badges}</div>
                        </div>
                        <button class="follow-btn" data-id="${s.id}" data-username="${s.username}">Follow</button>
                    </div>
                `;
            });

            html += `</div></div>`;
            section.innerHTML = html;

            section.querySelectorAll('.follow-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    handleFollow(e.currentTarget);
                });
            });

            section.querySelector('.dismiss').addEventListener('click', (e) => {
                e.stopPropagation();
                section.style.display = 'none';
            });

            return section;
        }

        // ============================================================
        //  FOLLOW BUTTON
        // ============================================================
        function updateFollowUI(btn, isFollowing) {
            if (isFollowing) {
                btn.textContent = 'Following';
                btn.classList.add('following');
            } else {
                btn.textContent = 'Follow';
                btn.classList.remove('following');
            }
        }

        function handleFollow(btn) {
            if (!user) {
                popup.classList.add('active');
                return;
            }

            const userId = btn.dataset.id;
            const isFollowing = btn.classList.contains('following');
            const newState = !isFollowing;

            updateFollowUI(btn, newState);

            if (followDebounceTimers[userId]) {
                clearTimeout(followDebounceTimers[userId]);
            }

            followDebounceTimers[userId] = setTimeout(async () => {
                const finalState = btn.classList.contains('following');
                const action = finalState ? 'follow' : 'unfollow';
                const method = finalState ? 'POST' : 'DELETE';

                try {
                    const res = await fetch(`/api/follows?action=${action}`, {
                        method,
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ targetUserId: userId })
                    });

                    if (!res.ok) {
                        updateFollowUI(btn, !finalState);
                    }
                } catch (err) {
                    updateFollowUI(btn, !finalState);
                    console.error(err);
                }

                delete followDebounceTimers[userId];
            }, 800);
        }

        // ============================================================
        //  CREATE POST ELEMENT
        // ============================================================
        function createPostElement(p) {
            const card = document.createElement('div');
            card.className = 'post-card';
            card.dataset.id = p.id;
            card.dataset.slug = p.slug;

            const heartIcon = `<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
            const heartFilled = `<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
            const bookmarkIcon = `<svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>`;
            const bookmarkFilled = `<svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>`;
            const commentIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`;
            const shareIcon = `<svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>`;

            const localLike = localLikes[p.id] || { count: p.like_count || 0, liked: p.liked || false };
            const localSave = localSaves[p.id] || { count: p.save_count || 0, saved: p.saved || false };

            const likeClass = localLike.liked ? 'liked' : '';
            const saveClass = localSave.saved ? 'saved' : '';
            const likeIconHtml = localLike.liked ? heartFilled : heartIcon;
            const saveIconHtml = localSave.saved ? bookmarkFilled : bookmarkIcon;

            const date = new Date(p.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            const formattedViews = formatViewCount(p.view_count || 0);

            let descHTML = '';
            if (p.description) {
                const isLong = p.description.length > 120;
                descHTML = `
                    <div class="description-wrap">
                        <div class="description-text ${isLong ? 'collapsed' : ''}">${p.description}</div>
                        ${isLong ? `<button class="see-more-btn">See more</button>` : ''}
                    </div>
                `;
            }

            const optimizedImage = getOptimizedImageUrl(p.image_main);

            card.innerHTML = `
                <div class="post-header">
                    <div class="avatar">
                        <img src="/raafiiih/profile.png" onerror="this.src='https://ui-avatars.com/api/?name=R&background=4f46e5&color=fff'" alt="RAAFIIIH" />
                    </div>
                    <div class="user-info">
                        <div class="name" onclick="window.location.href='/@raafiiih'">
                            RAAFIIIH
                            <span class="badge-container"><span class="badge-premium"></span></span>
                        </div>
                        <div class="meta">${date} · ${formattedViews} views</div>
                    </div>
                </div>
                <div class="post-title">
                    <h1>${p.title}</h1>
                </div>
                ${descHTML}
                <div class="post-image-wrap">
                    <img src="${optimizedImage}" 
                         width="600" height="400"
                         loading="lazy"
                         decoding="async"
                         onerror="this.src='https://images.unsplash.com/photo-1542831371-29b0f74f9713?w=600&h=400&fit=crop&auto=format'" 
                         alt="${p.title}" />
                </div>
                <div class="action-bar">
                    <button class="like-btn ${likeClass}" data-id="${p.id}">
                        ${likeIconHtml} <span class="count">${localLike.count}</span>
                    </button>
                    <button class="comment-btn" data-id="${p.id}">
                        ${commentIcon} <span class="count">${p.comment_count || 0}</span>
                    </button>
                    <button class="save-btn ${saveClass}" data-id="${p.id}">
                        ${saveIconHtml} <span class="count">${localSave.count}</span>
                    </button>
                    <button class="share-btn" data-id="${p.id}">
                        ${shareIcon}
                    </button>
                </div>
                <div class="view-prompt-wrap">
                    <button class="btn-view-prompt" data-slug="${p.slug}">View Prompt</button>
                </div>
            `;

            card.querySelector('.like-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                handleLike(e.currentTarget, p.id);
            });

            card.querySelector('.save-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                handleSave(e.currentTarget, p.id);
            });

            card.querySelector('.share-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                navigator.clipboard.writeText(window.location.origin + '/prompt/' + p.slug);
                alert('Link copied to clipboard!');
            });

            card.querySelector('.comment-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                if (!user) { popup.classList.add('active'); return; }
                openCommentModal(p.id);
            });

            card.querySelector('.btn-view-prompt').addEventListener('click', () => {
                window.location.href = '/prompt/' + p.slug;
            });

            card.querySelector('.post-image-wrap img').addEventListener('click', (e) => {
                e.stopPropagation();
                imageModalContent.src = e.target.src;
                imageModal.classList.add('active');
            });

            const seeMoreBtn = card.querySelector('.see-more-btn');
            if (seeMoreBtn) {
                seeMoreBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const descText = seeMoreBtn.closest('.description-wrap').querySelector('.description-text');
                    const isCollapsed = descText.classList.contains('collapsed');
                    descText.classList.toggle('collapsed');
                    seeMoreBtn.textContent = isCollapsed ? 'See less' : 'See more';
                });
            }

            return card;
        }

        // ============================================================
        //  INTERACTIONS (Optimistic UI + Debounced API Sync)
        // ============================================================
        function updateLikeUI(btn, promptId, newCount, newLikedState) {
            const heartFilled = `<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
            const heartIcon = `<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
            if (newLikedState) {
                btn.classList.add('liked');
                btn.innerHTML = `${heartFilled} <span class="count">${newCount}</span>`;
            } else {
                btn.classList.remove('liked');
                btn.innerHTML = `${heartIcon} <span class="count">${newCount}</span>`;
            }
        }

        function handleLike(btn, promptId) {
            if (!user) { popup.classList.add('active'); return; }

            const current = localLikes[promptId] || { count: 0, liked: false };
            const newLiked = !current.liked;
            const newCount = newLiked ? current.count + 1 : current.count - 1;
            
            localLikes[promptId] = { count: newCount, liked: newLiked };
            updateLikeUI(btn, promptId, newCount, newLiked);

            if (likeDebounceTimers[promptId]) {
                clearTimeout(likeDebounceTimers[promptId]);
            }

            likeDebounceTimers[promptId] = setTimeout(async () => {
                const finalState = localLikes[promptId];
                if (!finalState) return;

                const action = finalState.liked ? 'like' : 'unlike';
                const method = finalState.liked ? 'POST' : 'DELETE';

                try {
                    const res = await fetch(`/api/interactions?action=${action}`, {
                        method,
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify({ promptId })
                    });
                    const data = await res.json();
                    if (data.success) {
                        localLikes[promptId] = { count: data.like_count, liked: finalState.liked };
                        document.querySelectorAll(`.like-btn[data-id="${promptId}"]`).forEach(el => {
                            updateLikeUI(el, promptId, data.like_count, finalState.liked);
                        });
                    } else {
                        const revertedLiked = !finalState.liked;
                        const revertedCount = revertedLiked ? finalState.count + 1 : finalState.count - 1;
                        localLikes[promptId] = { count: revertedCount, liked: revertedLiked };
                        document.querySelectorAll(`.like-btn[data-id="${promptId}"]`).forEach(el => {
                            updateLikeUI(el, promptId, revertedCount, revertedLiked);
                        });
                    }
                } catch (err) {
                    const revertedLiked = !finalState.liked;
                    const revertedCount = revertedLiked ? finalState.count + 1 : finalState.count - 1;
                    localLikes[promptId] = { count: revertedCount, liked: revertedLiked };
                    document.querySelectorAll(`.like-btn[data-id="${promptId}"]`).forEach(el => {
                        updateLikeUI(el, promptId, revertedCount, revertedLiked);
                    });
                }
                delete likeDebounceTimers[promptId];
            }, 800);
        }

        function updateSaveUI(btn, promptId, newCount, newSavedState) {
            const bookmarkFilled = `<svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>`;
            const bookmarkIcon = `<svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>`;
            if (newSavedState) {
                btn.classList.add('saved');
                btn.innerHTML = `${bookmarkFilled} <span class="count">${newCount}</span>`;
            } else {
                btn.classList.remove('saved');
                btn.innerHTML = `${bookmarkIcon} <span class="count">${newCount}</span>`;
            }
        }

        function handleSave(btn, promptId) {
            if (!user) { popup.classList.add('active'); return; }

            const current = localSaves[promptId] || { count: 0, saved: false };
            const newSaved = !current.saved;
            const newCount = newSaved ? current.count + 1 : current.count - 1;
            
            localSaves[promptId] = { count: newCount, saved: newSaved };
            updateSaveUI(btn, promptId, newCount, newSaved);

            if (saveDebounceTimers[promptId]) {
                clearTimeout(saveDebounceTimers[promptId]);
            }

            saveDebounceTimers[promptId] = setTimeout(async () => {
                const finalState = localSaves[promptId];
                if (!finalState) return;

                const action = finalState.saved ? 'save' : 'unsave';
                const method = finalState.saved ? 'POST' : 'DELETE';

                try {
                    const res = await fetch(`/api/interactions?action=${action}`, {
                        method,
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify({ promptId })
                    });
                    const data = await res.json();
                    if (data.success) {
                        localSaves[promptId] = { count: data.save_count, saved: finalState.saved };
                        document.querySelectorAll(`.save-btn[data-id="${promptId}"]`).forEach(el => {
                            updateSaveUI(el, promptId, data.save_count, finalState.saved);
                        });
                    } else {
                        const revertedSaved = !finalState.saved;
                        const revertedCount = revertedSaved ? finalState.count + 1 : finalState.count - 1;
                        localSaves[promptId] = { count: revertedCount, saved: revertedSaved };
                        document.querySelectorAll(`.save-btn[data-id="${promptId}"]`).forEach(el => {
                            updateSaveUI(el, promptId, revertedCount, revertedSaved);
                        });
                    }
                } catch (err) {
                    const revertedSaved = !finalState.saved;
                    const revertedCount = revertedSaved ? finalState.count + 1 : finalState.count - 1;
                    localSaves[promptId] = { count: revertedCount, saved: revertedSaved };
                    document.querySelectorAll(`.save-btn[data-id="${promptId}"]`).forEach(el => {
                        updateSaveUI(el, promptId, revertedCount, revertedSaved);
                    });
                }
                delete saveDebounceTimers[promptId];
            }, 800);
        }

        // ============================================================
        //  COMMENT MODAL
        // ============================================================
        let commentLikeTimers = {};

        async function openCommentModal(promptId) {
            currentPromptIdForComments = promptId;
            replyToCommentId = null;
            replyToUsername = null;
            commentModal.classList.add('active');
            commentInput.value = '';
            commentInput.placeholder = 'Write a comment...';
            renderCommentSkeletons(3);
            commentList.scrollTop = 0;

            try {
                const res = await fetch(`/api/comments?action=list&promptId=${promptId}&limit=50&offset=0`, {
                    headers: token ? { 'Authorization': `Bearer ${token}` } : {}
                });
                const data = await res.json();
                renderCommentsInModal(data.comments || []);
            } catch (err) {
                commentList.innerHTML = `<div style="text-align:center;padding:20px;color:#dc2626;">Error loading comments.</div>`;
            }
        }

        function renderCommentsInModal(comments) {
            if (comments.length === 0) {
                commentList.innerHTML = `<div style="text-align:center;padding:20px;color:#65676b;">No comments yet. Be the first!</div>`;
                return;
            }
            commentList.innerHTML = '';
            comments.forEach(c => {
                commentList.appendChild(createCommentElement(c));
            });
            commentList.scrollTop = 0;
        }

        function createCommentElement(c, isReply = false) {
            const div = document.createElement('div');
            div.className = 'comment-item';
            div.dataset.id = c.id;

            const avatar = c.profiles?.avatar_url || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(c.profiles?.username || '?') + '&background=e4e6eb&color=1877f2&size=32';
            const displayName = c.profiles?.display_name || c.profiles?.username || 'Anonymous';
            const username = c.profiles?.username || 'anonymous';
            const time = timeAgo(c.created_at);
            const likeIcon = c.liked ? `<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>` : `<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
            const likeClass = c.liked ? 'liked' : '';

            let badgeHtml = '';
            if (c.profiles?.is_owner) {
                badgeHtml = `<span class="badge-container"><span class="badge-owner"></span></span>`;
            } else if (c.profiles?.is_premium) {
                badgeHtml = `<span class="badge-container"><span class="badge-premium"></span></span>`;
            }

            let html = `
                <div class="avatar-small" style="background-image:url(${avatar});background-size:cover;background-position:center;">
                    ${!c.profiles?.avatar_url ? displayName.charAt(0).toUpperCase() : ''}
                </div>
                <div class="body">
                    <div class="row">
                        <span class="name" onclick="window.location.href='/@${username}'">${displayName} ${badgeHtml}</span>
                        <span class="time">${time}</span>
                    </div>
                    <div class="content">${c.content}</div>
                    <div class="actions">
                        <button class="comment-like-btn ${likeClass}" data-id="${c.id}" data-count="${c.likes_count || 0}">
                            ${likeIcon} ${c.likes_count || 0}
                        </button>
                        <span style="color:#d1d5db;">·</span>
                        ${!isReply ? `<button class="reply-toggle" data-id="${c.id}" data-username="${username}">Reply</button>` : ''}
                    </div>
            `;

            if (!isReply && c.replies && c.replies.length > 0) {
                html += `<div class="replies">`;
                c.replies.forEach(r => {
                    html += createCommentElement(r, true).outerHTML;
                });
                html += `</div>`;
            }

            html += `</div></div>`;
            div.innerHTML = html;

            const likeBtn = div.querySelector('.comment-like-btn');
            if (likeBtn) {
                likeBtn.addEventListener('click', () => handleCommentLike(likeBtn, c.id));
            }

            const replyToggle = div.querySelector('.reply-toggle');
            if (replyToggle) {
                replyToggle.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const username = replyToggle.dataset.username;
                    replyToCommentId = c.id;
                    replyToUsername = username;
                    commentInput.value = `@${username} `;
                    commentInput.placeholder = `Reply to @${username}...`;
                    commentInput.focus();
                });
            }

            return div;
        }

        // ============================================================
        //  COMMENT LIKE
        // ============================================================
        function updateCommentLikeUI(btn, newCount, newLikedState) {
            const likeIcon = `<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
            const likeFilled = `<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
            if (newLikedState) {
                btn.classList.add('liked');
                btn.innerHTML = `${likeFilled} ${newCount}`;
            } else {
                btn.classList.remove('liked');
                btn.innerHTML = `${likeIcon} ${newCount}`;
            }
        }

        function handleCommentLike(btn, commentId) {
            if (!user) { popup.classList.add('active'); return; }

            const currentCount = parseInt(btn.dataset.count) || 0;
            const isLiked = btn.classList.contains('liked');
            const newLiked = !isLiked;
            const newCount = newLiked ? currentCount + 1 : currentCount - 1;
            btn.dataset.count = newCount;

            updateCommentLikeUI(btn, newCount, newLiked);

            if (commentLikeTimers[commentId]) {
                clearTimeout(commentLikeTimers[commentId]);
            }

            commentLikeTimers[commentId] = setTimeout(async () => {
                const finalLiked = btn.classList.contains('liked');
                const action = finalLiked ? 'like-comment' : 'unlike-comment';
                const method = finalLiked ? 'POST' : 'DELETE';

                try {
                    const res = await fetch(`/api/comments?action=${action}`, {
                        method,
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify({ commentId })
                    });
                    if (!res.ok) {
                        const revertLiked = !finalLiked;
                        const revertCount = revertLiked ? parseInt(btn.dataset.count) + 1 : parseInt(btn.dataset.count) - 1;
                        btn.dataset.count = revertCount;
                        updateCommentLikeUI(btn, revertCount, revertLiked);
                    }
                } catch (err) {
                    const revertLiked = !finalLiked;
                    const revertCount = revertLiked ? parseInt(btn.dataset.count) + 1 : parseInt(btn.dataset.count) - 1;
                    btn.dataset.count = revertCount;
                    updateCommentLikeUI(btn, revertCount, revertLiked);
                }
                delete commentLikeTimers[commentId];
            }, 800);
        }

        // ============================================================
        //  POST NEW COMMENT / REPLY
        // ============================================================
        commentSubmitBtn.addEventListener('click', async () => {
            if (!user) { popup.classList.add('active'); return; }
            let content = commentInput.value.trim();
            if (!content || !currentPromptIdForComments) return;
            
            let parentId = null;
            if (replyToCommentId && replyToUsername) {
                const mention = `@${replyToUsername}`;
                if (content.startsWith(mention)) {
                    parentId = replyToCommentId;
                    content = content.substring(mention.length).trim();
                    if (!content) {
                        commentInput.value = `@${replyToUsername} `;
                        commentInput.focus();
                        return;
                    }
                } else {
                    replyToCommentId = null;
                    replyToUsername = null;
                }
            }

            commentSubmitBtn.disabled = true;

            const tempId = 'temp_' + Date.now();
            const tempComment = {
                id: tempId,
                user_id: user.id,
                content: content,
                likes_count: 0,
                created_at: new Date().toISOString(),
                profiles: {
                    id: user.id,
                    username: user.username,
                    display_name: user.display_name || user.username,
                    avatar_url: user.avatar_url,
                    is_premium: user.is_premium || false,
                    is_owner: user.is_owner || false
                },
                liked: false,
                replies: [],
                parent_id: parentId
            };

            if (parentId) {
                const parentEl = commentList.querySelector(`.comment-item[data-id="${parentId}"]`);
                if (parentEl) {
                    let repliesContainer = parentEl.querySelector('.replies');
                    if (!repliesContainer) {
                        repliesContainer = document.createElement('div');
                        repliesContainer.className = 'replies';
                        const body = parentEl.querySelector('.body');
                        body.appendChild(repliesContainer);
                    }
                    const replyEl = createCommentElement(tempComment, true);
                    repliesContainer.appendChild(replyEl);
                    setTimeout(() => {
                        replyEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 50);
                } else {
                    const noCommentsMsg = commentList.querySelector('div[style*="No comments yet"]');
                    if (noCommentsMsg) commentList.innerHTML = '';
                    commentList.prepend(createCommentElement(tempComment));
                }
            } else {
                const noCommentsMsg = commentList.querySelector('div[style*="No comments yet"]');
                if (noCommentsMsg) commentList.innerHTML = '';
                commentList.prepend(createCommentElement(tempComment));
            }

            commentInput.value = '';
            commentInput.placeholder = 'Write a comment...';
            replyToCommentId = null;
            replyToUsername = null;

            try {
                const res = await fetch('/api/comments?action=add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ 
                        promptId: currentPromptIdForComments, 
                        content,
                        parentId: parentId || null
                    })
                });
                if (res.ok) {
                    const fetchRes = await fetch(`/api/comments?action=list&promptId=${currentPromptIdForComments}&limit=50&offset=0`, {
                        headers: token ? { 'Authorization': `Bearer ${token}` } : {}
                    });
                    const data = await fetchRes.json();
                    renderCommentsInModal(data.comments || []);
                } else {
                    const tempEls = commentList.querySelectorAll(`[data-id^="temp_"]`);
                    tempEls.forEach(el => el.remove());
                    document.querySelectorAll('.replies:empty').forEach(el => el.remove());
                    alert('Failed to post comment. Please try again.');
                }
            } catch (err) {
                const tempEls = commentList.querySelectorAll(`[data-id^="temp_"]`);
                tempEls.forEach(el => el.remove());
                document.querySelectorAll('.replies:empty').forEach(el => el.remove());
                alert('Failed to post comment. Please try again.');
            }

            commentSubmitBtn.disabled = false;
        });

        commentInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                commentSubmitBtn.click();
            }
        });

        commentInput.addEventListener('input', () => {
            if (replyToUsername && replyToCommentId) {
                const currentValue = commentInput.value.trim();
                const mention = `@${replyToUsername}`;
                if (!currentValue.startsWith(mention)) {
                    replyToCommentId = null;
                    replyToUsername = null;
                    commentInput.placeholder = 'Write a comment...';
                }
            }
        });

        // ============================================================
        //  TIME AGO HELPER
        // ============================================================
        function timeAgo(dateStr) {
            const now = new Date();
            const past = new Date(dateStr);
            const diffMs = now - past;
            const diffSec = Math.floor(diffMs / 1000);
            const diffMin = Math.floor(diffSec / 60);
            const diffHour = Math.floor(diffMin / 60);
            const diffDay = Math.floor(diffHour / 24);
            if (diffSec < 60) return 'just now';
            if (diffMin < 60) return diffMin + 'm';
            if (diffHour < 24) return diffHour + 'h';
            if (diffDay === 1) return 'yesterday';
            if (diffDay < 7) return diffDay + 'd';
            return new Date(dateStr).toLocaleDateString();
        }

        // ============================================================
        //  MODAL CONTROLS
        // ============================================================
        document.getElementById('closeCommentModal').addEventListener('click', () => {
            commentModal.classList.remove('active');
            replyToCommentId = null;
            replyToUsername = null;
        });
        commentModal.addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                commentModal.classList.remove('active');
                replyToCommentId = null;
                replyToUsername = null;
            }
        });

        imageModal.addEventListener('click', () => {
            imageModal.classList.remove('active');
        });

        // ============================================================
        //  INFINITE SCROLL
        // ============================================================
        let scrollTimeout;
        window.addEventListener('scroll', () => {
            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                const scrollY = window.scrollY;
                const windowHeight = window.innerHeight;
                const docHeight = document.documentElement.scrollHeight;
                if (scrollY + windowHeight >= docHeight - 400) {
                    loadFeed();
                }
            }, 100);
        });

        // ============================================================
        //  SEARCH
        // ============================================================
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                const q = searchInput.value.trim();
                if (q.length >= 2) {
                    window.location.href = `/search/?q=${encodeURIComponent(q)}`;
                }
            }, 500);
        });

        // ============================================================
        //  POPUP CONTROLS
        // ============================================================
        document.getElementById('popupLoginBtn').addEventListener('click', () => {
            window.location.href = '/';
        });
        document.getElementById('popupCloseBtn').addEventListener('click', () => {
            popup.classList.remove('active');
        });
        popup.addEventListener('click', (e) => {
            if (e.target === e.currentTarget) popup.classList.remove('active');
        });

        // ============================================================
        //  PROFILE BUTTON
        // ============================================================
        profileBtn.addEventListener('click', (e) => {
            e.preventDefault();
            if (user) {
                window.location.href = `/@${user.username}`;
            } else {
                window.location.href = '/';
            }
        });

        // ============================================================
        //  INIT
        // ============================================================
        async function init() {
            await verifyUser();
            loadFeed(true);
        }
        init();
    </script>
