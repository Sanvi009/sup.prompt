<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explore - Prompt Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #f8fafc;
            color: #111827;
        }
        header {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }
        header .brand {
            font-size: 22px;
            font-weight: 700;
            color: #111827;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        header .controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        header .controls .btn-login {
            padding: 8px 20px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        header .controls .btn-login:hover { background: #4338ca; }
        .guest-badge {
            background: #f3f4f6;
            color: #6b7280;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 32px 24px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }
        .card {
            position: relative;
            width: 100%;
            padding-bottom: 100%;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            background: #f1f5f9;
            transition: transform 0.2s;
        }
        .card:hover { transform: scale(1.02); }
        .card img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card .stats {
            position: absolute;
            bottom: 8px;
            left: 8px;
            right: 8px;
            display: flex;
            gap: 12px;
            padding: 8px 12px;
            background: rgba(0,0,0,0.6);
            border-radius: 8px;
            color: white;
            font-size: 13px;
            backdrop-filter: blur(4px);
        }
        @media (max-width: 1024px) { .grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 768px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 480px) { .grid { grid-template-columns: repeat(1, 1fr); } }
        .empty { text-align: center; padding: 80px 24px; color: #6b7280; grid-column: 1 / -1; }
        .empty .icon { font-size: 56px; }
        .loader {
            text-align: center;
            padding: 40px;
            color: #6b7280;
            grid-column: 1 / -1;
        }
        .loader .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid #e5e7eb;
            border-top-color: #4f46e5;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <header>
        <div class="brand">📚 Prompt Library</div>
        <div class="controls">
            <span class="guest-badge">👤 Guest Mode</span>
            <button class="btn-login" onclick="window.location.href='/login.html'">Sign In</button>
        </div>
    </header>
    <div class="container">
        <div class="grid" id="grid"></div>
        <div class="loader" id="loader">
            <span class="spinner"></span> Loading...
        </div>
    </div>

    <script>
        let sb = null;
        let page = 0;
        const pageSize = 12;
        let loading = false;
        let hasMore = true;

        async function initSupabase() {
            const res = await fetch('/api/supabase-config');
            const data = await res.json();
            sb = supabase.createClient(data.url, data.anonKey);
            loadPrompts();
        }

        async function loadPrompts() {
            if (loading || !hasMore) return;
            loading = true;
            document.getElementById('loader').style.display = 'block';

            const { data, error } = await sb
                .from('prompts')
                .select('*')
                .eq('is_published', true)
                .order('created_at', { ascending: false })
                .range(page * pageSize, (page + 1) * pageSize - 1);

            loading = false;
            document.getElementById('loader').style.display = 'none';

            if (error) {
                document.getElementById('grid').innerHTML = `<div class="empty"><div class="icon">⚠️</div>Error loading</div>`;
                return;
            }

            if (data.length === 0) {
                hasMore = false;
                if (page === 0) {
                    document.getElementById('grid').innerHTML = `<div class="empty"><div class="icon">📭</div>No prompts found</div>`;
                }
                return;
            }

            data.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => window.location.href = `/prompt/${p.slug}`;
                card.innerHTML = `
                    <img src="${p.image_main}" loading="lazy" onerror="this.src='https://via.placeholder.com/400'" alt="${p.title}" />
                    <div class="stats">
                        <span>❤️ ${p.like_count || 0}</span>
                        <span>💾 ${p.save_count || 0}</span>
                        <span>👁️ ${p.view_count || 0}</span>
                    </div>
                `;
                document.getElementById('grid').appendChild(card);
            });

            page++;
            hasMore = data.length === pageSize;
        }

        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY;
            const windowHeight = window.innerHeight;
            const docHeight = document.documentElement.scrollHeight;
            if (scrollY + windowHeight >= docHeight - 400) {
                loadPrompts();
            }
        });

        document.addEventListener('DOMContentLoaded', initSupabase);
    </script>
</body>
</html>
